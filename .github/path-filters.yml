# Single source of truth for "what changed files trigger what workflow."
#
# Consumed by dorny/paths-filter in each required-check workflow's `changes` job.
# Each key maps to a workflow basename (or a gated job within one); values are picomatch globs.
#
# Editing this file re-triggers every workflow on the next PR (the file is
# listed in every filter), which is the desired safety property when the
# triggering rules themselves change.

lint:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".cargo/config.toml"
  - "**/clippy.toml"
  - "deny.toml"
  - "supply-chain/**"
  - ".github/workflows/lint.yml"
  - ".github/actions/setup-zebra-build/**"
  - ".github/scripts/apt-install.sh"
  - ".github/path-filters.yml"

hadolint:
  - "docker/Dockerfile"
  - ".github/workflows/lint.yml"
  - ".github/path-filters.yml"

shellcheck:
  - "**/*.sh"
  - ".github/workflows/lint.yml"
  - ".github/path-filters.yml"

api_diff:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".github/workflows/pr-gate.yml"
  - ".github/path-filters.yml"

unit_tests:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".config/nextest.toml"
  # Pages that tests compare with the code.
  - "book/src/README.md"
  - "book/src/user/config.md"
  - "book/src/user/rpc.md"
  - ".github/workflows/tests-unit.yml"
  - ".github/actions/setup-zebra-build/**"
  - ".github/scripts/apt-install.sh"
  - ".github/path-filters.yml"

test_crates:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".cargo/config.toml"
  - "**/clippy.toml"
  - ".github/workflows/test-crates.yml"
  - ".github/actions/setup-zebra-build/**"
  - ".github/scripts/apt-install.sh"
  - ".github/path-filters.yml"

test_docker:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - "docker/Dockerfile"
  - "docker/entrypoint.sh"
  - "docker/**/*.toml"
  - "zebrad/tests/common/configs/**"
  - ".github/workflows/test-docker.yml"
  - ".github/scripts/test-docker-memory-budget.sh"
  - ".github/path-filters.yml"

# The sustained Testnet memory-budget sync depends on public peers and takes over an hour, so pull
# requests only run it when they change the memory budget or its test.
memory_budget_testnet:
  - "zebrad/src/components/resources.rs"
  - "zebrad/src/components/resources/**"
  - "zebrad/src/components/sync/budget.rs"
  - "zebrad/src/components/sync/budget/**"
  - "zebra-state/src/service/memory_limits.rs"
  - "zebra-state/src/service/finalized_state/disk_db.rs"
  - "zebra-network/src/peer_set/initialize.rs"
  - ".github/scripts/test-docker-memory-budget.sh"

book:
  - "book/**"
  # The book includes this file.
  - "CONTRIBUTING.md"
  - "katex-header.html"
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".cargo/config.toml"
  - "**/clippy.toml"
  - ".github/workflows/book.yml"
  - ".github/workflows/docs-check.yml"
  - ".github/path-filters.yml"

# The mdBook build in docs-check.yml; a subset of `book`, without the Rust inputs that only
# the internal rustdoc needs.
book_links:
  - "book/**"
  - "CONTRIBUTING.md"
  - ".github/workflows/docs-check.yml"
  - ".github/path-filters.yml"

coverage:
  - "**/*.rs"
  - "**/Cargo.toml"
  - "**/Cargo.lock"
  - ".config/nextest.toml"
  - "codecov.yml"
  - ".github/workflows/coverage.yml"
  - ".github/path-filters.yml"

docs_check:
  - "**/*.md"
  - "book/**"
  - ".lychee.toml"
  - ".codespellrc"
  - ".trunk/configs/.markdownlint.yaml"
  - ".github/workflows/docs-check.yml"
  - ".github/path-filters.yml"
