name: 'Setup Zebra Build Environment'
description: 'Install libclang, protoc, and RocksDB as system libraries'
runs:
  using: 'composite'
  steps:
    # The Azure Ubuntu mirror regularly trickles these ~42 MB of `.deb`s for
    # minutes at a time, so they are cached. See apt-install.sh for how cached
    # files are verified and when the cache is refreshed.
    - name: Compute apt package cache key
      id: apt-cache-key
      if: runner.os == 'Linux'
      shell: bash
      env:
        PACKAGES: clang libclang-dev protobuf-compiler librocksdb-dev
      run: |
        echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
        echo "prefix=apt-archives-v1-${ImageOS:-unknown}-${RUNNER_ARCH}-$(sha256sum <<< "$PACKAGES" | cut -c1-8)" >> "$GITHUB_OUTPUT"

    # Nothing is ever saved under the bare prefix, so this restores the most
    # recent `<prefix>-<commit>` entry from this branch or main.
    - name: Restore apt package cache
      if: runner.os == 'Linux'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt-cache-key.outputs.prefix }}
        restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}-

    - name: Install libclang, protoc, and librocksdb-dev on Ubuntu
      id: apt-install
      if: runner.os == 'Linux'
      shell: bash
      env:
        APT_ARCHIVES_CACHE_DIR: ${{ runner.temp }}/apt-archives
        PACKAGES: ${{ steps.apt-cache-key.outputs.packages }}
      run: |
        # libclang is needed at build time: librocksdb-sys always runs bindgen
        # (via clang-sys) to generate FFI bindings, even when linking the system
        # RocksDB via ROCKSDB_LIB_DIR.
        #
        # The install is wrapped so a stalling Ubuntu mirror fails fast instead
        # of burning the whole job timeout. Composite action steps cannot set
        # `timeout-minutes`, so the bound has to come from the script.
        # shellcheck disable=SC2086 # PACKAGES is a space-separated list
        "$GITHUB_ACTION_PATH/../../scripts/apt-install.sh" $PACKAGES
        echo "ROCKSDB_LIB_DIR=/usr/lib/" >> $GITHUB_ENV

    # Only main saves, like the Rust caches (see .github/workflows/README.md).
    # The commit is in the key so the parallel jobs of one push share one entry,
    # and the restore above picks the newest.
    - name: Save apt package cache
      if: >-
        runner.os == 'Linux' &&
        github.ref == 'refs/heads/main' &&
        steps.apt-install.outputs.refreshed == 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt-cache-key.outputs.prefix }}-${{ github.sha }}
