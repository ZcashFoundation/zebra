# Required source-PR gate verifying that a conventional-commit declaration is
# consistent with its code and changelog entries.
name: PR Gate

on:
  # `edited` re-runs the source gate when the declaration changes; labels
  # re-evaluate release readiness.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Cancel obsolete gate runs after new commits. Events that cannot change the gate
# outcome use separate groups so they cannot cancel the required PR Gate run:
# unrelated labels, and edits that leave the title and the base branch alone.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'release' &&
      'ignored-label' ||
      github.event.action == 'edited' &&
      github.event.changes.title == null &&
      github.event.changes.base == null &&
      'ignored-edit' ||
      'required'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads the changed-file list

env:
  CLICOLOR: 1

jobs:
  changes:
    # Only the release label affects gate results, and only a title or base edit
    # can change the declaration this gate reads. Every other label and edit event
    # is a no-op, so it must not spend a runner or replace the required check.
    if: >-
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.filter.outputs.semver || 'true' }}
      breaking: ${{ steps.title.outputs.breaking }}
      type: ${{ steps.title.outputs.type }}
      conventional: ${{ steps.title.outputs.conventional }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Require one release-plz configuration
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! -f release-plz.toml || -e .release-plz.toml ]]; then
            echo "::error title=Invalid release-plz configuration::Keep the complete configuration in release-plz.toml and do not add .release-plz.toml."
            exit 1
          fi
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml
      - name: Read the declaration from the PR title
        id: title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          breaking_marker='^[a-z]+(\([^)]*\))?!:'
          conventional_marker='^([a-z]+)(\([^)]*\))?!?: .+'

          breaking=false
          type=
          conventional=false

          if [[ "$PR_TITLE" =~ $breaking_marker ]]; then
            breaking=true
          fi

          if [[ "$PR_TITLE" =~ $conventional_marker ]]; then
            conventional=true
            type="${BASH_REMATCH[1]}"
          elif [[ "$PR_TITLE" =~ ^([a-z]+) ]]; then
            type="${BASH_REMATCH[1]}"
          fi

          {
            echo "breaking=$breaking"
            echo "type=$type"
            echo "conventional=$conventional"
          } >> "$GITHUB_OUTPUT"

  semver-checks:
    needs: changes
    # Real work runs only on contributor pull requests that change Rust and do not already declare
    # a break with `!`. A declared break is allowed through; release-plz majors the version at release.
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.semver == 'true' &&
      needs.changes.outputs.breaking == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the PR head, not the merge commit, so the API delta is the PR's own.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the baseline from the PR's fork point
        id: baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `fetch-depth: 0` populates the base branch without persisting credentials.
          echo "rev=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-zebra-build
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          # Gate the consumer-facing library crates only. zebrad is a binary whose build script
          # needs test-only protos absent from the baseline; zebra-test and zebra-utils are test
          # and tooling crates whose feature-gated APIs are not stability surfaces.
          exclude: zebrad, zebra-test, zebra-utils
          feature-group: default-features
          baseline-rev: ${{ steps.baseline.outputs.rev }}

  # This checks for changelog entries depending on the type of the PR (per title).
  # An entry is required for a crate if any file in the crate changed.
  # If the title indicates a breaking change, the changelog must also have a `### Breaking Changes` section.
  changelog-gate:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check declaration and package changelogs
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING: ${{ needs.changes.outputs.breaking }}
          CONVENTIONAL: ${{ needs.changes.outputs.conventional }}
          DECLARED_TYPE: ${{ needs.changes.outputs.type }}
        run: |
          # `fetch-depth: 0` populates the base branch without persisting credentials.
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
          bash .github/scripts/validate-pr-changelogs.sh \
            "$merge_base" HEAD "$CONVENTIONAL" "$DECLARED_TYPE" "$BREAKING"

  # No ruleset context pins this worker's display name; the ruleset requires `pr-gate-result`.
  release-readiness:
    name: Release readiness
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null) &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    permissions:
      contents: read
    uses: ./.github/workflows/release-readiness.yml
    with:
      base-ref: ${{ github.base_ref }}
      target-sha: ${{ github.event.pull_request.head.sha }}

  pr-gate-result:
    # Keep skipped unrelated-label and unrelated-edit runs from replacing the
    # required check.
    name: >-
      ${{
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        github.event.label.name != 'release' &&
        'Label does not affect the PR gate' ||
        github.event.action == 'edited' &&
        github.event.changes.title == null &&
        github.event.changes.base == null &&
        'Edit does not affect the PR gate' ||
        'pr-gate-result'
      }}
    runs-on: ubuntu-latest
    if: >-
      always() &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null)
    needs: [changes, semver-checks, changelog-gate, release-readiness]
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # Leave it for the PR author and reviewer to decide if the changelog
          # entries are good enough. `allowed-failures` also tolerates a skip, and
          # must not be combined with `allowed-skips`: alls-green requires every
          # `allowed-skips` job to be skipped or successful, even a failure-allowed one.
          # Temporarily keep semver checks advisory until #11409 is resolved.
          allowed-failures: changelog-gate, semver-checks
          allowed-skips: release-readiness
