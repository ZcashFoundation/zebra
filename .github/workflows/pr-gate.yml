# Required source-PR gate verifying that a conventional-commit declaration is
# consistent with its code and changelog entries.
name: PR Gate

on:
  # `edited` re-runs the source gate when the declaration changes; labels
  # re-evaluate release readiness.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Cancel obsolete gate runs after new commits. Events that cannot change the gate
# outcome use separate groups so they cannot cancel the required PR Gate run:
# unrelated labels, and edits that leave the title and the base branch alone.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'release' &&
      'ignored-label' ||
      github.event.action == 'edited' &&
      github.event.changes.title == null &&
      github.event.changes.base == null &&
      'ignored-edit' ||
      'required'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads the changed-file list

env:
  CLICOLOR: 1

jobs:
  changes:
    # Only the release label affects gate results, and only a title or base edit
    # can change the declaration this gate reads. Every other label and edit event
    # is a no-op, so it must not spend a runner or replace the required check.
    if: >-
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api_diff: ${{ steps.filter.outputs.api_diff || 'true' }}
      breaking: ${{ steps.title.outputs.breaking }}
      type: ${{ steps.title.outputs.type }}
      conventional: ${{ steps.title.outputs.conventional }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Require one release-plz configuration
        if: github.event_name == 'pull_request'
        run: |
          if [[ ! -f release-plz.toml || -e .release-plz.toml ]]; then
            echo "::error title=Invalid release-plz configuration::Keep the complete configuration in release-plz.toml and do not add .release-plz.toml."
            exit 1
          fi
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml
      - name: Read the declaration from the PR title
        id: title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          breaking_marker='^[a-z]+(\([^)]*\))?!:'
          conventional_marker='^([a-z]+)(\([^)]*\))?!?: .+'

          breaking=false
          type=
          conventional=false

          if [[ "$PR_TITLE" =~ $breaking_marker ]]; then
            breaking=true
          fi

          if [[ "$PR_TITLE" =~ $conventional_marker ]]; then
            conventional=true
            type="${BASH_REMATCH[1]}"
          elif [[ "$PR_TITLE" =~ ^([a-z]+) ]]; then
            type="${BASH_REMATCH[1]}"
          fi

          {
            echo "breaking=$breaking"
            echo "type=$type"
            echo "conventional=$conventional"
          } >> "$GITHUB_OUTPUT"

  api-diff:
    needs: changes
    # Real work runs only on pull requests that change Rust. A declared break runs too: the diff is
    # the evidence a reviewer needs to judge what the `!` actually covers. Merge groups and pushes
    # skip it because each queued pull request already passed it against its own fork point.
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.api_diff == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Check out the PR head, not the merge commit, so the API delta is the PR's own.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the baseline from the PR's fork point
        id: baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `fetch-depth: 0` populates the base branch without persisting credentials.
          echo "rev=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      # zc builds the workspace crates at both refs, so librocksdb-sys needs libclang.
      - uses: ./.github/actions/setup-zebra-build
      - name: Restore the zc rustdoc cache
        # Restores what `api-diff-warm` writes on main; a pull request must never save.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/zc-cache
          # zc keys entries by commit SHA and prunes them after 14 days, so a prefix restore is safe.
          key: zc-cache-${{ runner.os }}-v0.5.0-${{ steps.baseline.outputs.rev }}
          restore-keys: zc-cache-${{ runner.os }}-v0.5.0-
      # A declared break only has to analyse cleanly; an undeclared one must not break the API.
      - name: Diff the public API and dependencies
        uses: ZcashFoundation/zc@15a7a89df262cf68bdf5daac807d14638307488b # v0.5.0
        with:
          baseline: ${{ steps.baseline.outputs.rev }}
          fail-on: ${{ needs.changes.outputs.breaking == 'true' && 'error' || 'api-breaking' }}

  # A pull request can only restore caches written on its own ref or on main, so this
  # push-only job is what makes the pull request side's `restore-keys` prefix hit.
  api-diff-warm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: api-diff-warm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the baseline this push builds on
        id: baseline
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A force push or a new branch reports an all-zero or unreachable predecessor.
          baseline="$BEFORE"
          if [[ "$baseline" =~ ^0+$ ]] || ! git cat-file -e "${baseline}^{commit}" 2> /dev/null; then
            baseline="$(git rev-parse 'HEAD^')"
          fi
          echo "rev=$baseline" >> "$GITHUB_OUTPUT"
      # zc builds the workspace crates at both refs, so librocksdb-sys needs libclang.
      - uses: ./.github/actions/setup-zebra-build
      - name: Restore the zc rustdoc cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/zc-cache
          key: zc-cache-${{ runner.os }}-v0.5.0-${{ github.sha }}
          restore-keys: zc-cache-${{ runner.os }}-v0.5.0-
      - name: Diff the public API and dependencies
        # Warming only has to populate the cache, so findings and environmental failures both pass.
        continue-on-error: true
        uses: ZcashFoundation/zc@15a7a89df262cf68bdf5daac807d14638307488b # v0.5.0
        with:
          baseline: ${{ steps.baseline.outputs.rev }}
          fail-on: none
      - name: Save the zc rustdoc cache
        if: always() && hashFiles('target/zc-cache/**') != ''
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/zc-cache
          key: zc-cache-${{ runner.os }}-v0.5.0-${{ github.sha }}

  # Release reviewers read the whole public API and dependency diff since the last release, refreshed on every update.
  release-api-diff:
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null) &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write # creates or updates the sticky API diff comment
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the last release tag
        id: baseline
        run: |
          if ! tag="$(git describe --tags --match 'v*' --abbrev=0 HEAD)"; then
            echo "::error title=No release tag found::This diff needs a v* tag reachable from the release PR head."
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "rev=$(git rev-parse "${tag}^{commit}")"
          } >> "$GITHUB_OUTPUT"
      # zc builds the workspace crates at both refs, so librocksdb-sys needs libclang.
      - uses: ./.github/actions/setup-zebra-build
      - name: Restore the zc rustdoc cache
        # Restores what `api-diff-warm` writes on main; a pull request must never save.
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/zc-cache
          # zc keys rustdoc JSON by commit SHA, nightly toolchain, and cargo-public-api version.
          # This zc pin uses the same toolchain and cargo-public-api as v0.5.0, so it shares that cache.
          key: zc-cache-${{ runner.os }}-v0.5.0-${{ steps.baseline.outputs.rev }}
          restore-keys: zc-cache-${{ runner.os }}-v0.5.0-
      - name: Diff the public API and dependencies since the last release
        id: zc
        # The changelog output (ZcashFoundation/zc#25) is on zc main but not yet released.
        # Move this pin to the first zc release that contains it.
        uses: ZcashFoundation/zc@77ebc256b7cbf971c3b8db6a56247088acb5bb2c # v0.5.0-1-g77ebc25
        with:
          baseline: ${{ steps.baseline.outputs.tag }}
          fail-on: none
          with-changelog: "true"
      - name: Post the diff as a pull request comment
        if: always() && steps.baseline.outputs.tag != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGELOG_FILE: ${{ steps.zc.outputs.changelog }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TAG: ${{ steps.baseline.outputs.tag }}
        with:
          script: |
            const fs = require('fs');

            const tag = process.env.TAG;
            const head = process.env.HEAD_SHA.slice(0, 12);
            const file = process.env.CHANGELOG_FILE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const heading = `## Public API diff since ${tag}`;

            let body;
            if (file && fs.existsSync(file)) {
              body = `${heading}\n\nComparing \`${tag}\` with \`${head}\`.\n\n${fs.readFileSync(file, 'utf8')}`;
            } else {
              body = `${heading}\n\nThe diff could not be produced. See [the job log](${runUrl}).`;
            }

            // GitHub rejects comment bodies over 65536 characters, so cut back to a whole section.
            if (body.length > 65536) {
              const kept = body.slice(0, 60000);
              const boundary = kept.lastIndexOf('\n#');
              body = `${boundary > 0 ? kept.slice(0, boundary) : kept}\n\nThe remaining sections are in [the job log](${runUrl}).\n`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Match the heading without its tag so a new baseline replaces the previous comment.
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## Public API diff since')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # This checks for changelog entries depending on the type of the PR (per title).
  # An entry is required for a crate if any file in the crate changed.
  # If the title indicates a breaking change, the changelog must also have a `### Breaking Changes` section.
  changelog-gate:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check declaration and package changelogs
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING: ${{ needs.changes.outputs.breaking }}
          CONVENTIONAL: ${{ needs.changes.outputs.conventional }}
          DECLARED_TYPE: ${{ needs.changes.outputs.type }}
        run: |
          # `fetch-depth: 0` populates the base branch without persisting credentials.
          merge_base="$(git merge-base "origin/$BASE_REF" HEAD)"
          bash .github/scripts/validate-pr-changelogs.sh \
            "$merge_base" HEAD "$CONVENTIONAL" "$DECLARED_TYPE" "$BREAKING"

  # No ruleset context pins this worker's display name; the ruleset requires `pr-gate-result`.
  release-readiness:
    name: Release readiness
    if: >-
      github.event_name == 'pull_request' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null) &&
      startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest-xl
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve release comparison
        id: release-target
        env:
          BASE_REF: ${{ github.base_ref }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_tip="$(git rev-parse "origin/${BASE_REF}")"
          base_sha="$(git merge-base "${base_tip}" "${TARGET_SHA}")"
          if [[ "${base_sha}" != "${base_tip}" ]]; then
            echo "::error title=Release PR is behind main::Wait for release-plz to update this PR before review."
            exit 1
          fi
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
      # Checks if the changelogs have entries for the versions being released
      # (used in the in the release PR).
      - name: Validate release changelogs
        id: changelogs
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.release-target.outputs.base_sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/validate-release-changelogs.sh "${BASE_SHA}" "${TARGET_SHA}"
      - name: Install Cargo 1.91
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.91.0
          cache-on-failure: true
      - name: Install libclang for librocksdb-sys bindgen
        run: .github/scripts/apt-install.sh libclang-dev
      - name: Check desired release state
        id: cargo-release
        continue-on-error: true
        uses: ZcashFoundation/cargo-release@0083006dfd267ed560b4cf1aed347ef2f326162e # v0.1.0
        with:
          phase: check
          base-sha: ${{ steps.release-target.outputs.base_sha }}
          target-sha: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ github.token }}
      - name: Summarize release readiness
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          CHANGELOG_RESULT: ${{ steps.changelogs.outcome }}
          PLAN: ${{ steps.cargo-release.outputs.plan }}
          REPORT: ${{ steps.cargo-release.outputs.report }}
        run: |
          {
            echo "## Release readiness"
            echo "| Validation | Result |"
            echo "| --- | --- |"
            echo "| Changelogs | \`${CHANGELOG_RESULT}\` |"
            echo "| Cargo release | \`${CARGO_RELEASE_RESULT}\` |"
            if [[ -n "${PLAN}" ]]; then
              echo '### Plan'
              echo '```json'
              jq . <<< "${PLAN}" || printf '%s\n' "${PLAN}"
              echo '```'
            fi
            if [[ -n "${REPORT}" ]]; then
              echo '### External state'
              echo '```json'
              jq . <<< "${REPORT}" || printf '%s\n' "${REPORT}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Require successful release checks
        if: always()
        env:
          CARGO_RELEASE_RESULT: ${{ steps.cargo-release.outcome }}
          CHANGELOG_RESULT: ${{ steps.changelogs.outcome }}
        run: |
          if [[ "${CHANGELOG_RESULT}" != "success" || "${CARGO_RELEASE_RESULT}" != "success" ]]; then
            echo "::error title=Release readiness failed::Review each failed validation step and the job summary."
            exit 1
          fi

  pr-gate-result:
    # Keep skipped unrelated-label and unrelated-edit runs from replacing the
    # required check.
    name: >-
      ${{
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        github.event.label.name != 'release' &&
        'Label does not affect the PR gate' ||
        github.event.action == 'edited' &&
        github.event.changes.title == null &&
        github.event.changes.base == null &&
        'Edit does not affect the PR gate' ||
        'pr-gate-result'
      }}
    runs-on: ubuntu-latest
    if: >-
      always() &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'release') &&
      (github.event.action != 'edited' ||
      github.event.changes.title != null || github.event.changes.base != null)
    needs: [changes, api-diff, changelog-gate, release-readiness]
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          # Leave it for the PR author and reviewer to decide if the changelog
          # entries are good enough. `allowed-failures` also tolerates a skip, and
          # must not be combined with `allowed-skips`: alls-green requires every
          # `allowed-skips` job to be skipped or successful, even a failure-allowed one.
          allowed-failures: changelog-gate
          # `api-diff` runs only on pull requests that change Rust, and `release-readiness`
          # only on Release PRs. Whenever either runs, it must succeed.
          allowed-skips: api-diff, release-readiness
