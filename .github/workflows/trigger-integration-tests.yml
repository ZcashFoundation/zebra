name: Trigger Integration Tests

on:
  # Runs weekly against `main` instead of on every PR (#11616): the suite is slow,
  # its checks are not required, and failures are often caused by Zaino/Zallet
  # changes unrelated to the PR. Dispatch it manually to test a specific PR.
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run integration tests against (leave empty to test the selected branch)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  trigger-integration:
    name: Trigger integration tests
    # Scheduled runs need the app secrets, so skip them on forks and mirrors.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'ZcashFoundation/zebra' }}
    runs-on: ubuntu-latest
    permissions:
      # Needed to post a sticky comment on the PR when triggered manually.
      pull-requests: write
    steps:
      - name: Resolve target PR details (manual PR dispatch only)
        id: pr
        if: inputs.pr_number
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          DATA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,body)
          SHA=$(echo "$DATA" | jq -r .headRefOid)
          BODY=$(echo "$DATA" | jq -r .body)
          TEST_SHA=$(echo "$BODY" | sed '/[^ ]ZIT-Revision/!d' | sed -E 's/.*ZIT-Revision: ([^\\]*)\\.*/\1/')
          # PR body is contributor-controlled; only forward sha-like values.
          if [[ -n "$TEST_SHA" ]] && ! [[ "$TEST_SHA" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::warning::Ignoring invalid ZIT-Revision value"
            TEST_SHA=""
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "test_sha=$TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.Z3_APP_ID }}
          private-key: ${{ secrets.Z3_APP_PRIVATE_KEY }}
          owner: zcash
          repositories: integration-tests

      - name: Trigger integration tests
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.pr.outputs.sha || github.sha }}
          TEST_SHA: ${{ steps.pr.outputs.test_sha }}
          # Stable per-source key so the integration repo can cancel a superseded
          # run: the PR number for manual PR dispatches, otherwise the branch
          # name (e.g. `main`).
          SOURCE_REF: ${{ inputs.pr_number && format('pr-{0}', inputs.pr_number) || github.ref_name }}
        run: >
          gh api repos/zcash/integration-tests/dispatches
          --field event_type="zebra-interop-request"
          --field client_payload[sha]="${SHA}"
          --field client_payload[test_sha]="${TEST_SHA}"
          --field client_payload[source_ref]="${SOURCE_REF}"

      - name: Post sticky comment on PR (manual PR dispatch only)
        if: inputs.pr_number
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 #v3.0.4
        with:
          number: ${{ inputs.pr_number }}
          header: integration-tests-dispatch
          message: |
            🚀 Integration tests dispatched manually against this PR's HEAD (`${{ steps.pr.outputs.sha }}`).

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
