# Build the `next` branch book. When this run succeeds, `book.yml` on `main`
# publishes the result at `/next`. See book/src/dev/next-branch.md.
#
# `next` merges need no review, so this runs on `next`: any cache its book
# preprocessors write stays scoped to `next`, out of reach of `main`'s jobs.
name: Book (next)

on:
  push:
    branches: [next]
    # The book's sources, including the root files it includes.
    paths:
      - "book/**"
      - "README.md"
      - "CONTRIBUTING.md"

permissions: {}

jobs:
  build:
    name: Build next Book
    if: github.repository_owner == 'ZcashFoundation'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup mdBook
        uses: jontze/action-mdbook@6c0be56d14c4bf16861b00af61f50ff7400ce502 #v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mdbook-version: ~0.5
          use-mermaid: true

      - name: Build next book
        run: |
          mdbook build book --dest-dir "$(pwd)"/target/next-book
        env:
          MDBOOK_BOOK__TITLE: The Zebra Book (next)

      # `main` publishes the newest build until a newer one replaces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: next-book
          path: target/next-book
          if-no-files-found: error
          retention-days: 90
