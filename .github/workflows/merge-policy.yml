# Fast required check for repository-owned merge holds and Release PR freshness in the queue.
name: Merge Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  merge-policy:
    name: merge-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # reads the labels of the pull requests in a merge group
      contents: read # compares a queued Release PR with the queue base
    steps:
      - name: Enforce do-not-merge
        if: github.event_name == 'pull_request'
        env:
          HELD: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-merge') }}
        run: |
          if [[ "${HELD}" == "true" ]]; then
            echo "::error title=Held by do-not-merge::Remove the \`do-not-merge\` label before adding this pull request to the merge queue."
            exit 1
          fi

          echo "No repository-owned merge hold is active."

      # A merge group carries no pull request metadata, so the label has to be read
      # back from the pull requests the queue named in the branch. Without this the
      # label only fails the source pull request, which does not stop a group that has
      # already been built: the group's own check passes and the queue merges it.
      - name: Enforce do-not-merge across the merge group
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>, one `pr-` segment
          # per entry in the group.
          numbers="$(grep -oE 'pr-[0-9]+-' <<<"${REF}" | grep -oE '[0-9]+' || true)"

          if [[ -z "${numbers}" ]]; then
            echo "::error title=Merge group not recognised::No pull request number in \`${REF}\`, so this check cannot tell whether a hold applies."
            exit 1
          fi

          held=0

          while read -r number; do
            # Fail closed: a group whose pull requests cannot be read is held, not let through.
            if ! pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" --jq '[.head.ref, .head.sha, (.labels | map(.name) | join(","))] | @tsv')"; then
              echo "::error title=Cannot read pull request #${number}::Reading it failed, so this check cannot tell whether a hold applies."
              exit 1
            fi

            IFS=$'\t' read -r head_ref head_sha labels <<<"${pr}"

            if [[ ",${labels}," == *,do-not-merge,* ]]; then
              echo "::error title=Held by do-not-merge::Pull request #${number} in this merge group carries \`do-not-merge\`."
              held=1
            else
              echo "Pull request #${number}: no repository-owned merge hold is active."
            fi

            if [[ "${head_ref}" == release-plz-* && ",${labels}," == *,release,* ]]; then
              # Fail closed: a Release PR that cannot be compared with the queue base is held.
              if ! behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${head_sha}" --jq .behind_by)"; then
                echo "::error title=Cannot compare Release PR #${number}::Comparing ${head_sha} with the queue base ${BASE_SHA} failed, so this check cannot tell whether the Release PR is behind."
                exit 1
              fi

              if [[ "${behind}" != "0" ]]; then
                echo "::error title=Release PR is behind the queue::Release PR #${number} (${head_sha}) is ${behind} commit(s) behind the queue base ${BASE_SHA}, so its release plan does not cover everything being merged. Wait for release-plz to update it."
                held=1
              fi
            fi
          done <<<"${numbers}"

          exit "${held}"
