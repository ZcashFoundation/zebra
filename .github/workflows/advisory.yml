name: Advisory Checks

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  link-check:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Restore Lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 #v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --cache
            --config .lychee.toml
            "**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta-clippy:
    name: Beta Clippy / ${{ matrix.type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        type: [release, tests]
        include:
          - type: release
            args: --workspace --all-targets
            features: default-release-binaries
          - type: tests
            args: --workspace --all-targets
            features: default-release-binaries proptest-impl lightwalletd-grpc-tests zebra-checkpoints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          components: clippy
          toolchain: beta
          cache-on-failure: true
      - uses: ./.github/actions/setup-zebra-build
      - name: Run Clippy
        run: cargo clippy ${{ matrix.args }} --features "${{ matrix.features }}"

  beta-unit-tests:
    name: Beta unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: beta
          cache-key: advisory-unit-tests-beta
          cache-on-failure: true
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc #v2.86.7
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-zebra-build
      - name: Run unit tests
        run: cargo nextest run --profile ci --locked --release --features default-release-binaries --run-ignored=all

  nightly-docs:
    name: Nightly documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: nightly
          cache-on-failure: true
      - uses: ./.github/actions/setup-zebra-build
      - name: Build documentation
        run: cargo doc --no-deps --workspace --all-features --document-private-items --target-dir "$(pwd)"/target/internal
        env:
          # Keep the warning policy aligned with the published documentation build.
          RUSTDOCFLAGS: --html-in-header katex-header.html -A rustdoc::private_intra_doc_links -D warnings

  nightly-features:
    name: Nightly exhaustive features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: nightly
          cache-on-failure: true
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc #v2.86.7
        with:
          tool: cargo-hack
      - uses: ./.github/actions/setup-zebra-build
      - name: Check feature combinations
        run: cargo hack check --all
        env:
          RUSTFLAGS: -D warnings

  unused-deps:
    name: Nightly unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: nightly
          cache-on-failure: true
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc #v2.86.7
        with:
          tool: cargo-udeps
      - uses: ./.github/actions/setup-zebra-build
      - name: Check unused dependencies
        run: cargo udeps --workspace --all-targets --all-features --locked

  failure-issue:
    name: Open or update an issue for advisory failures
    needs:
      - link-check
      - beta-clippy
      - beta-unit-tests
      - nightly-docs
      - nightly-features
      - unused-deps
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: jayqi/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 #v1.3.0
        with:
          title-template: "{{refname}} advisory checks failed: {{eventName}} in {{workflow}}"
          label-name: S-ci-fail-auto-issue
          always-create-new-issue: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
