name: Check No Git Dependencies (label added)

# The `check-no-git-dependencies` job in `tests-unit.yml` only runs on
# pull requests carrying the `A-release` label. That workflow's
# `pull_request` trigger uses the default activity types
# (opened, synchronize, reopened), so adding the label to an existing PR
# does not re-run it: the check stays skipped until the next commit is
# pushed (issue #10897).
#
# This workflow listens for the `labeled` event and runs the same check.
# A (lightweight) run is created for any label added to a PR targeting
# `main`, but the job only executes when the added label is `A-release`
# and is skipped otherwise. This keeps the check off `tests-unit.yml`, so
# the full unit-test suite is not re-run on label changes.

on:
  pull_request:
    types: [labeled]
    branches: [main]

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  check-no-git-dependencies:
    name: Check no git dependencies
    if: github.event.label.name == 'A-release'
    permissions:
      contents: read
      id-token: write
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1.16.1
        with:
          toolchain: stable
          cache-on-failure: true
      - uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 #v2.79.3
        with:
          tool: cargo-nextest
      - uses: ./.github/actions/setup-zebra-build
      - name: Check no git dependencies
        run: cargo nextest run --profile check-no-git-dependencies --locked --run-ignored=only
