name: Coverage

on:
  push:
    branches: [main]

# Ensures that only one workflow task will run at a time. Previous builds, if
# already in process, will get cancelled. Only the latest commit will be allowed
# to run, cancelling any workflows in between
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LIB_BACKTRACE: 1
  RUST_LOG: info
  COLORBT_SHOW_HIDDEN: 1

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.filter.outputs.coverage || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

  run-coverage:
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    # `contents: read` is intentionally omitted: this job uploads source to a
    # public Codecov project, so missing checkout permission keeps it inert
    # on private forks as a fail-closed safeguard.
    permissions:
      id-token: write
      statuses: write
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      # The Sentry tests read source paths from stack traces, which need line tables.
      # Setting this before setup-rust-toolchain stops it from defaulting to 0.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 #v2.0.1
        with:
          toolchain: stable
          components: llvm-tools-preview
          cache-on-failure: true
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 #v2.90.2
        with:
          tool: cargo-llvm-cov,nextest
      - uses: ./.github/actions/setup-zebra-build
      - name: Run coverage tests
        run: |
          cargo llvm-cov --no-report nextest
          # TODO: Do we need --locked --release --features "default-release-binaries" here?
          cargo llvm-cov report --lcov --output-path lcov.info
        env:
          # We set cases to 1, because some tests already run 1 case by default.
          # We set maximum shrink iterations to 0, because we don't expect failures in coverage tests.
          # Coverage tests are much slower than other tests, particularly in hot loops.
          PROPTEST_CASES: 1
          PROPTEST_MAX_SHRINK_ITERS: 0

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          files: lcov.info

  coverage:
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - changes
      - run-coverage
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 #v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: run-coverage
