name: Zebra Performance Benchmarks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  run-benchmarks:
    name: Run and Compare Benchmarks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run cargo bench (zebra-chain)
        run: |
          cargo bench --package zebra-chain -- --profile-time=0

      - name: Run Performance Comparison Script
        run: |
          python3 scripts/compare_bench.py

      - name: Archive benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: criterion-benchmark-results
          path: target/criterion/
