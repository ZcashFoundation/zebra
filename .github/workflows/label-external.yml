# Labels issues and PRs opened by people outside the maintainer team, so outside work can be
# filtered. The team is whoever can write to the repository; this turns that into the
# `external-contribution` label, which used to be applied by hand and drifted.
name: Label External Contributions

on:
  issues:
    types: [opened]
  # zizmor: ignore[dangerous-triggers] -- nothing is checked out and no PR code runs; the job
  # reads the trusted event payload and applies a label.
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  label:
    name: Label outside author
    # Bots (dependabot, release-plz, CI) are not contributions. `author_association` only skips the
    # obvious team cases: it reports private org members as CONTRIBUTOR, so the step checks access too.
    if: >-
      github.event.sender.type != 'Bot' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                github.event.issue.author_association || github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add the external-contribution label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          AUTHOR: ${{ github.event.issue.user.login || github.event.pull_request.user.login }}
        run: |
          permission=$(gh api "repos/${REPOSITORY}/collaborators/${AUTHOR}/permission" --jq .permission) || permission=none
          case "${permission}" in
            admin | maintain | write) echo "${AUTHOR} has ${permission} access, not labeling" ;;
            *) gh issue edit "${NUMBER}" --repo "${REPOSITORY}" --add-label external-contribution ;;
          esac
