# Promotes one prepared immutable GAR image to the stable public Zebra tags.
# The image is copied by digest; this workflow never rebuilds it.
name: Promote release image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: The immutable GAR image to promote, as repository@sha256:digest
        required: true
        type: string
      source_sha:
        description: The immutable source commit represented by the image
        required: true
        type: string
      version:
        description: The zebrad release version without a v prefix
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

jobs:
  promote:
    name: Promote public image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    permissions:
      artifact-metadata: write # record registry storage for attestations
      contents: read
      id-token: write # authenticate registries, signatures, and attestations
      attestations: write # store release image provenance and SBOM
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 #v3.0.0
        with:
          workload_identity_provider: "${{ vars.GCP_WIF }}"
          service_account: "${{ vars.GCP_ARTIFACTS_SA }}"
          token_format: access_token

      - name: Login to Google Artifact Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3

      - name: Promote immutable image
        id: promote
        env:
          SOURCE_IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          source_repository="${SOURCE_IMAGE%@*}"
          source_digest="${SOURCE_IMAGE##*@}"
          if [[ -z "${VERSION}" || ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ || "${source_repository}" == "${SOURCE_IMAGE}" ]]; then
            echo "::error::version and immutable source image are required"
            exit 1
          fi

          gar_tags=("${VERSION}")
          hub_tags="${VERSION}"
          if [[ "${VERSION}" != *-* ]]; then
            gar_tags+=("latest")
            hub_tags+=",latest"
          fi

          oras tag "${SOURCE_IMAGE}" "${gar_tags[@]}"
          oras copy --no-tty \
            "${SOURCE_IMAGE}" \
            "docker.io/zfnd/zebra:${hub_tags}"

          gar_digest=$(oras manifest fetch --descriptor \
            "${source_repository}:${VERSION}" | jq -er '.digest')
          hub_digest=$(oras manifest fetch --descriptor \
            "docker.io/zfnd/zebra:${VERSION}" | jq -er '.digest')
          if [[ "${gar_digest}" != "${source_digest}" || "${hub_digest}" != "${source_digest}" ]]; then
            echo "::error::promoted image differs from prepared digest ${source_digest}"
            exit 1
          fi
          echo "digest=${source_digest}" >> "${GITHUB_OUTPUT}"
          echo "gar_repository=${source_repository}" >> "${GITHUB_OUTPUT}"

      - name: Describe release source for provenance
        env:
          PROVENANCE_BUILDER_WORKFLOW: .github/workflows/zfnd-promote-release-image.yml
          PROVENANCE_OUTPUT: ${{ runner.temp }}/release-image-provenance.json
          PROVENANCE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/write-release-provenance.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: docker.io/zfnd/zebra
          subject-digest: ${{ steps.promote.outputs.digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/release-image-provenance.json
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign promoted images
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          GAR_REPOSITORY: ${{ steps.promote.outputs.gar_repository }}
        run: |
          cosign sign --yes "${GAR_REPOSITORY}@${DIGEST}"
          cosign sign --yes "docker.io/zfnd/zebra@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: docker.io/zfnd/zebra@${{ steps.promote.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: docker.io/zfnd/zebra
          subject-digest: ${{ steps.promote.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify release signatures
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          cosign verify "docker.io/zfnd/zebra@${DIGEST}" \
            --certificate-identity-regexp='^https://github\.com/ZcashFoundation/zebra/\.github/workflows/zfnd-promote-release-image\.yml@' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          gh attestation verify "oci://docker.io/zfnd/zebra@${DIGEST}" \
            --owner ZcashFoundation \
            --signer-workflow ZcashFoundation/zebra/.github/workflows/zfnd-promote-release-image.yml \
            --format json \
            | jq -e --arg source_sha "${SOURCE_SHA}" \
              'any(.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[]?;
                .digest.gitCommit == $source_sha)' >/dev/null

      - name: Update Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa #v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: zfnd/zebra
          short-description: ${{ github.event.repository.description }}
