# Release workflow: Release PR planning and resumable publication.
#
# Pipeline:
#   push to main                  -> creates or updates the Release PR
#   merged, approved Release PR   -> reconciles crates, tags, and the public
#                                   zebrad GitHub Release
#   workflow_dispatch            -> resumes the same merged Release PR by number
#
# Downstream triggers (independent workflows, not managed here):
#   release:released  -> release-binaries.yml (Docker Hub)
#   release:published -> zfnd-deploy-nodes-gcp.yml (GCP deployment)
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      operation:
        description: "Check an open Release PR or resume a merged one"
        required: true
        default: check
        type: choice
        options:
          - check
          - resume
      release_pr_number:
        description: "Release PR number"
        required: true
        type: string

# Deny all at workflow level; each job declares minimum permissions.
permissions: {}

jobs:
  # Runs on every push to main and leaves post-merge execution to Zebra's
  # release controller.
  release-pr:
    name: Create or update Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create and update the release branch
      pull-requests: write # create and update the Release PR
    steps:
      - name: Generate release app token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Create or update Release PR
        id: release-plz-pr
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 #v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - name: Add zebrad version to Release PR title
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RELEASE_PRS: ${{ steps.release-plz-pr.outputs.prs }}
        run: |
          set -euo pipefail

          ZEBRAD_RELEASE_PR="$(jq -c '
            map(select(any(.releases[]?; .package_name == "zebrad")))
            | first // empty
          ' <<< "${RELEASE_PRS:-[]}")"
          if [ -z "${ZEBRAD_RELEASE_PR}" ]; then
            echo "No zebrad release in release-plz output; keeping the generated title."
            exit 0
          fi

          PR_NUMBER="$(jq -r '.number' <<< "${ZEBRAD_RELEASE_PR}")"
          VERSION="$(jq -r '
            .releases[] | select(.package_name == "zebrad") | .version
          ' <<< "${ZEBRAD_RELEASE_PR}")"
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ] || [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "::error::release-plz did not return both the PR number and zebrad version: ${ZEBRAD_RELEASE_PR}"
            exit 1
          fi

          gh pr edit "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "chore: release v${VERSION}"

  release-target:
    name: Verify Release PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
       contains(github.event.pull_request.labels.*.name, 'A-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: read # verify that the selected merge commit is on main
      pull-requests: read # validate the selected Release PR
    concurrency:
      group: release-target-${{ github.event.pull_request.number || inputs.release_pr_number }}
      cancel-in-progress: false
    outputs:
      base_sha: ${{ steps.release-target.outputs.base_sha }}
      operation: ${{ steps.release-target.outputs.operation }}
      pr_number: ${{ steps.release-target.outputs.pr_number }}
      target_sha: ${{ steps.release-target.outputs.target_sha }}
    steps:
      - name: Resolve immutable release target
        id: release-target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_PR_NUMBER: ${{ inputs.release_pr_number }}
        with:
          script: |
            const requestedOperation =
              context.eventName === "workflow_dispatch"
                ? process.env.INPUT_OPERATION
                : "resume";
            const rawPrNumber =
              context.eventName === "workflow_dispatch"
                ? process.env.INPUT_PR_NUMBER
                : String(context.payload.pull_request?.number ?? "");
            const prNumber = Number(rawPrNumber);

            if (
              !Number.isSafeInteger(prNumber) ||
              prNumber <= 0 ||
              !["check", "resume"].includes(requestedOperation)
            ) {
              throw new Error("operation and Release PR number are invalid");
            }

            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    baseRefName
                    baseRefOid
                    headRefName
                    headRefOid
                    headRepository { nameWithOwner }
                    labels(first: 100) { nodes { name } }
                    mergeCommit { oid }
                    merged
                    reviewDecision
                    state
                  }
                }
              }`,
              { ...context.repo, number: prNumber },
            );
            const pr = result.repository.pullRequest;
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            const isReleasePr =
              pr?.baseRefName === "main" &&
              pr.headRepository?.nameWithOwner === expectedRepository &&
              pr.headRefName.startsWith("release-plz-") &&
              pr.labels.nodes.some(({ name }) => name === "A-release");

            if (!isReleasePr || (pr.state !== "OPEN" && !pr.merged)) {
              throw new Error(
                `PR #${prNumber} is not an open or merged internal A-release Release PR`,
              );
            }

            let baseSha;
            let targetSha;
            if (requestedOperation === "check" && !pr.merged) {
              const comparison =
                await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${pr.baseRefOid}...${pr.headRefOid}`,
                });
              baseSha = comparison.data.merge_base_commit.sha;
              targetSha = pr.headRefOid;
            } else {
              if (
                !pr.merged ||
                pr.reviewDecision !== "APPROVED" ||
                pr.mergeCommit?.oid === undefined
              ) {
                throw new Error(
                  `PR #${prNumber} is not an approved merged Release PR`,
                );
              }
              targetSha = pr.mergeCommit.oid;
              const commit = await github.rest.repos.getCommit({
                ...context.repo,
                ref: targetSha,
              });
              baseSha = commit.data.parents[0]?.sha;
              if (baseSha === undefined) {
                throw new Error(
                  `release target ${targetSha} has no first parent`,
                );
              }
              const comparison =
                await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${targetSha}...${pr.baseRefName}`,
                });
              if (comparison.data.merge_base_commit.sha !== targetSha) {
                throw new Error(
                  `release target ${targetSha} is not an ancestor of current main`,
                );
              }
            }

            core.setOutput("base_sha", baseSha);
            core.setOutput("operation", requestedOperation);
            core.setOutput("pr_number", String(prNumber));
            core.setOutput("target_sha", targetSha);

  release-check:
    name: Check release without publishing
    needs: release-target
    if: needs.release-target.outputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    concurrency:
      group: release-check-${{ needs.release-target.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check out current release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: controller
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ needs.release-target.outputs.target_sha }}
      - name: Install Cargo 1.91
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 #v1.17.0
        with:
          toolchain: 1.91.0
          cache-on-failure: true
      - name: Install libclang for librocksdb-sys bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Check desired release state
        id: cargo-release
        uses: ZcashFoundation/cargo-release@2df8f3c8030169e9a9b756528a841fc59a7e5c25
        with:
          phase: check
          source-directory: release-source
          base-sha: ${{ needs.release-target.outputs.base_sha }}
          target-sha: ${{ needs.release-target.outputs.target_sha }}
          config-path: controller/.github/cargo-release.yml
          github-token: ${{ github.token }}
      - name: Summarize release check
        if: always()
        env:
          PLAN: ${{ steps.cargo-release.outputs.plan }}
          REPORT: ${{ steps.cargo-release.outputs.report }}
        run: |
          {
            echo "## Cargo Release check"
            if [[ -n "${PLAN}" ]]; then
              echo '### Plan'
              echo '```json'
              jq . <<< "${PLAN}"
              echo '```'
            fi
            if [[ -n "${REPORT}" ]]; then
              echo '### Report'
              echo '```json'
              jq . <<< "${REPORT}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # The Release PR merge is the human gate. The controller always runs from
  # current main, while release source comes from the immutable merge commit.
  release:
    name: Publish crates and GitHub Release
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-') &&
       contains(github.event.pull_request.labels.*.name, 'A-release')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'resume')
    runs-on: ubuntu-latest
    permissions:
      contents: write # reconcile repository tags and GitHub Releases
      id-token: write # authenticate to crates.io through OIDC
      pull-requests: read # verify the selected merged Release PR
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Check out current release controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          path: controller
          persist-credentials: false
          ref: main
      - name: Resolve and verify approved Release PR
        id: release-target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.release_pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            PR_NUMBER="${INPUT_PR_NUMBER}"
          else
            PR_NUMBER="${EVENT_PR_NUMBER}"
          fi
          python3 controller/.github/scripts/reconcile-release.py resolve-pr \
            "${PR_NUMBER}" \
            --repository "${REPOSITORY}" \
            --github-output "${GITHUB_OUTPUT}"
      - name: Check out immutable release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          path: release-source
          persist-credentials: false
          ref: ${{ steps.release-target.outputs.target_sha }}
      - name: Verify immutable release ancestry
        env:
          BASE_SHA: ${{ steps.release-target.outputs.base_sha }}
          TARGET_SHA: ${{ steps.release-target.outputs.target_sha }}
        run: |
          set -euo pipefail

          if ! git -C controller merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "::error::Release target ${TARGET_SHA} is not an ancestor of current main."
            exit 1
          fi
          TARGET_PARENT="$(git -C release-source rev-parse "${TARGET_SHA}^")"
          if [ "${TARGET_PARENT}" != "${BASE_SHA}" ]; then
            echo "::error::Release target ${TARGET_SHA} has parent ${TARGET_PARENT}, but PR metadata records ${BASE_SHA}."
            exit 1
          fi
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1.16.1
        with:
          toolchain: 1.91.0
          cache-on-failure: true
      - name: Build immutable release plan
        id: plan
        working-directory: release-source
        env:
          BASE_SHA: ${{ steps.release-target.outputs.base_sha }}
          TARGET_SHA: ${{ steps.release-target.outputs.target_sha }}
        run: |
          set -euo pipefail

          ../controller/.github/scripts/validate-release-changelogs.sh \
            "${BASE_SHA}" \
            "${TARGET_SHA}" \
            "${RUNNER_TEMP}/release-plan.json"
          echo "has_zebrad=$(jq -r '.zebrad != null' "${RUNNER_TEMP}/release-plan.json")" >> "${GITHUB_OUTPUT}"
      - name: Install libclang for librocksdb-sys bindgen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Preflight external release state
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          python3 controller/.github/scripts/reconcile-release.py preflight \
            "${RUNNER_TEMP}/release-plan.json" \
            "${RUNNER_TEMP}/missing-packages.json" \
            --source release-source \
            --repository "${GITHUB_REPOSITORY}" \
            --observations-output "${RUNNER_TEMP}/release-observations.json"
          echo "missing_count=$(jq 'length' "${RUNNER_TEMP}/missing-packages.json")" >> "${GITHUB_OUTPUT}"
      - name: Validate complete release package set
        working-directory: release-source
        run: |
          set -euo pipefail

          publish_args=(publish --dry-run --locked)
          while IFS= read -r package; do
            publish_args+=(--package "${package}")
          done < <(jq -r '.packages[].name' "${RUNNER_TEMP}/release-plan.json")
          cargo +1.91.0 "${publish_args[@]}"
      - name: Generate release app token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - name: Validate release app token
        if: steps.app-token.outputs.token == ''
        run: |
          echo "::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. The app token is required before crates publish so tags and the zebrad GitHub Release use the release app identity."
          exit 1
      - name: Authenticate to crates.io
        id: crates-io-auth
        if: steps.preflight.outputs.missing_count != '0'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 #v1.0.5
      - name: Publish missing packages
        if: steps.preflight.outputs.missing_count != '0'
        timeout-minutes: 60
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          python3 controller/.github/scripts/reconcile-release.py publish \
            "${RUNNER_TEMP}/release-plan.json" \
            --source release-source \
            --attempts 3
      - name: Verify published package identities
        run: |
          python3 controller/.github/scripts/reconcile-release.py verify-packages \
            "${RUNNER_TEMP}/release-plan.json"
      - name: Reconcile release tags
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 controller/.github/scripts/reconcile-release.py reconcile-tags \
            "${RUNNER_TEMP}/release-plan.json" \
            --source release-source \
            --repository "${GITHUB_REPOSITORY}"
      - name: Verify zebrad installs from crates.io
        if: steps.plan.outputs.has_zebrad == 'true'
        timeout-minutes: 30
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.zebrad.version' "${RUNNER_TEMP}/release-plan.json")"
          for attempt in 1 2 3; do
            if cargo +1.91.0 install --locked --force --version "=${VERSION}" zebrad; then
              ~/.cargo/bin/zebrad --version
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          echo "::error::zebrad ${VERSION} did not install from crates.io after 3 attempts."
          exit 1
      - name: Reconcile zebrad GitHub Release
        if: steps.plan.outputs.has_zebrad == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 controller/.github/scripts/reconcile-release.py reconcile-release \
            "${RUNNER_TEMP}/release-plan.json" \
            --source release-source \
            --repository "${GITHUB_REPOSITORY}"
