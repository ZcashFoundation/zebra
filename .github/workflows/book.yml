name: Book

on:
  push:
    branches: [main]
  # The site root documents the latest release. A published release appears at the
  # root on the next push to `main`, or immediately through a manual run. A
  # `release` trigger would expose this workflow's caches to cache poisoning.
  workflow_dispatch:

# GitHub Pages accepts one deployment at a time, and every run publishes the
# whole site. One concurrency group for all triggers keeps deployments from
# overlapping; a newer run replaces any run still waiting, and an in-progress
# run is not cancelled midway through a deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      book: ${{ steps.filter.outputs.book || 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/path-filters.yml

  build:
    name: Build Docs
    needs: changes
    if: needs.changes.outputs.book == 'true'
    permissions:
      contents: read
      id-token: write
      statuses: write
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # `main` is always published under /main/, even from a manual run on another branch.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Setup mdBook
        uses: jontze/action-mdbook@6c0be56d14c4bf16861b00af61f50ff7400ce502 #v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          mdbook-version: ~0.5
          use-mermaid: true
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 #v1.16.1
        with:
          # This job needs nightly for the unstable rustdoc flags below.
          # Pinned: nightly >= 2026-09-08 ICEs in rustdoc's auto-trait synthesis
          # while documenting zebra-consensus, so `cargo doc` cannot complete.
          # Regressed by https://github.com/rust-lang/rust/pull/162182.
          toolchain: nightly-2026-09-04
          cache-on-failure: true
      - uses: ./.github/actions/setup-zebra-build

      # Operators read the site root, so it documents the release they can install.
      # Setting the BOOK_ROOT_REF repository variable publishes another ref there,
      # for example `main` when a documentation fix should not wait for a release,
      # or in a fork without releases. A failed release lookup fails the build,
      # rather than publishing unreleased documentation at the root.
      - name: Select the ref published at the site root
        id: root
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_REF: ${{ vars.BOOK_ROOT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$ROOT_REF" ]; then
            ROOT_REF=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          test -n "$ROOT_REF"
          echo "ref=$ROOT_REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ steps.root.outputs.ref }}
          path: root-ref
          persist-credentials: false

      - name: Build Zebra book
        run: |
          mdbook build root-ref/book --dest-dir "$(pwd)"/target/docs
          mdbook build book --dest-dir "$(pwd)"/target/docs/main
        env:
          # The -A and -W settings must be the same as the `rustdocflags` in:
          # https://github.com/ZcashFoundation/zebra/blob/main/.cargo/config.toml#L87
          RUSTDOCFLAGS: --html-in-header katex-header.html -A rustdoc::private_intra_doc_links -D warnings

      - name: Build internal docs
        run: |
          cargo doc --no-deps --workspace --all-features --document-private-items --target-dir "$(pwd)"/target/internal
          # Copy internal docs to docs directory
          mkdir -p target/docs/internal
          cp -r target/internal/doc/* target/docs/internal/
        env:
          # No `-D warnings` here: rustdoc lints must not block publishing the
          # docs site. A broken intra-doc link kept the deploy skipped for days
          # in September 2026. The blocking `-D warnings` policy lives in
          # ./advisory.yml:jobs.docs ("Nightly documentation"), where #10968 put
          # it. A real `cargo doc` failure still fails this step.
          # The -A settings must be the same as the `rustdocflags` in:
          # https://github.com/ZcashFoundation/zebra/blob/main/.cargo/config.toml#L87
          RUSTDOCFLAGS: --html-in-header katex-header.html -A rustdoc::private_intra_doc_links --cfg docsrs --show-type-layout --generate-link-to-definition --enable-index-page -Zunstable-options

      - name: Include benchmark dashboard
        # Snapshots `gh-pages/dev/bench` (published by `benchmarks.yml`) into
        # the docs artifact so it is reachable at `/dev/bench`.
        run: |
          if ! git fetch origin gh-pages --depth=1 2>/dev/null; then
            echo "gh-pages branch does not exist yet, skipping benchmark dashboard"
            exit 0
          fi

          if ! git show origin/gh-pages:dev/bench/index.html >/dev/null 2>&1; then
            echo "gh-pages has no benchmark data yet, skipping benchmark dashboard"
            exit 0
          fi

          # index.html and data.js are published atomically by
          # github-action-benchmark, so data.js isn't guarded separately.
          mkdir -p target/docs/dev/bench
          git show origin/gh-pages:dev/bench/index.html > target/docs/dev/bench/index.html
          git show origin/gh-pages:dev/bench/data.js > target/docs/dev/bench/data.js

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: ./target/docs

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy if a push to main
    # TODO: Uncomment this before merging
    # if: github.ref_name == 'main' && github.event_name == 'push'
    needs: [changes, build]
    if: needs.changes.outputs.book == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment.
    # `contents: read` is intentionally omitted: this job publishes rendered
    # source to a public site, so missing checkout permission keeps it inert
    # on private forks as a fail-closed safeguard.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0

  book:
    runs-on: ubuntu-26.04
    if: always()
    needs:
      - changes
      - build
      - deploy
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe #v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: build, deploy
