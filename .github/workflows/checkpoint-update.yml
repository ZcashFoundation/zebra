# Automated checkpoint updates.
#
# Runs daily, and uses the latest successful integration test run on `main` that has both
# checkpoint artifacts. Downloads checkpoint artifacts produced by generate-checkpoints-* jobs,
# appends new entries to the checkpoint files, validates them, and opens or updates a PR.
#
# The PR requires human review before merge; checkpoints are consensus-critical.
#
#! Artifact handling:
#!
#! - `resolve-run` only uses runs of the integration test workflow file in this repository,
#!   from a `push`, `schedule` or `workflow_dispatch` event on `main` (`is_trusted_run`).
#! - Artifacts are downloaded into `runner.temp`, outside the checkout, and are only read as
#!   text by `merge-checkpoint-artifact.sh`.
#! - `validate-checkpoints` holds no secrets. The release App token is minted only in
#!   `open-pr`, after it has checked the validated files again.
name: Checkpoint Update

on:
  # Checkpoint PRs wait for review, so a daily update is frequent enough.
  schedule:
    - cron: "43 5 * * *"

  # Manual trigger, for testing or an update before the next scheduled run.
  workflow_dispatch:

permissions: {}

env:
  MAINNET_CHECKPOINTS: zebra-chain/src/parameters/checkpoint/main-checkpoints.txt
  TESTNET_CHECKPOINTS: zebra-chain/src/parameters/checkpoint/test-checkpoints.txt

jobs:
  # Successful integration runs can still skip the checkpoint generators, and
  # cancelled or failed runs may not have uploaded their artifacts.
  resolve-run:
    name: Find checkpoint artifacts
    # Copies of this repository don't have the release App, so only this one runs the schedule.
    if: github.event_name != 'schedule' || github.repository == 'ZcashFoundation/zebra'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.resolve-run.outputs.run_id }}
      run_url: ${{ steps.resolve-run.outputs.run_url }}
    steps:
      # Use the latest successful run with both artifacts.
      - name: Resolve integration test run ID
        id: resolve-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PRODUCER_PATH: .github/workflows/zfnd-ci-integration-tests-gcp.yml
        run: |
          # The only provenance check: runs of our own integration test workflow on
          # main, from `push`, `schedule` or `workflow_dispatch` events.
          is_trusted_run() {
            gh api "repos/${REPO}/actions/runs/$1" --jq '
              (.path | split("@")[0]) == env.PRODUCER_PATH
              and .head_repository.full_name == env.REPO
              and .head_branch == "main"
              and (.event | IN("push", "schedule", "workflow_dispatch"))
              and .conclusion == "success"
            ' | grep -qx true
          }

          # Run IDs on main in this repository that still have this artifact, newest first.
          artifact_runs() {
            gh api "repos/${REPO}/actions/artifacts?name=$1&per_page=100" --paginate \
              --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main"
                and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id'
          }

          MAINNET_RUNS=$(artifact_runs generate-checkpoints-mainnet-checkpoints)
          TESTNET_RUNS=$(artifact_runs generate-checkpoints-testnet-checkpoints)
          RUN_IDS=$(grep -Fx -f <(printf '%s\n' "$TESTNET_RUNS") <<< "$MAINNET_RUNS" || true)

          for RUN_ID in $RUN_IDS; do
            if ! is_trusted_run "$RUN_ID"; then
              echo "::warning::Skipping integration test run ${RUN_ID}: not a successful main run of ${PRODUCER_PATH} in ${REPO}"
              continue
            fi

            RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
            echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
            echo "Using integration test run: ${RUN_URL}"
            exit 0
          done

          echo "::notice::No trusted integration test run with both checkpoint artifacts found, skipping the update"

  # Parses the downloaded artifacts as data and builds the updated checkpoint files.
  # This job has no secrets: the release App token is never on a runner that has
  # downloaded the integration test artifacts.
  validate-checkpoints:
    name: Validate checkpoint artifacts
    needs: resolve-run
    if: needs.resolve-run.outputs.run_id != ''
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
          ref: main

      # Download into scratch directories outside the checkout, so an artifact can't replace
      # any file in the workspace. Each artifact gets its own empty directory.
      - name: Download mainnet checkpoint artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: generate-checkpoints-mainnet-checkpoints
          path: ${{ runner.temp }}/checkpoint-artifacts/mainnet
          run-id: ${{ needs.resolve-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download testnet checkpoint artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: generate-checkpoints-testnet-checkpoints
          path: ${{ runner.temp }}/checkpoint-artifacts/testnet
          run-id: ${{ needs.resolve-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Check the artifacts as data and append the new entries, then validate the results.
      - name: Merge and validate checkpoint files
        run: |
          mkdir -p "${RUNNER_TEMP}/validated-checkpoints"
          .github/scripts/merge-checkpoint-artifact.sh \
            "${RUNNER_TEMP}/checkpoint-artifacts/mainnet" main-checkpoints.txt "${MAINNET_CHECKPOINTS}" "${RUNNER_TEMP}/validated-checkpoints/main-checkpoints.txt"
          .github/scripts/merge-checkpoint-artifact.sh \
            "${RUNNER_TEMP}/checkpoint-artifacts/testnet" test-checkpoints.txt "${TESTNET_CHECKPOINTS}" "${RUNNER_TEMP}/validated-checkpoints/test-checkpoints.txt"

      - name: Check for changes
        id: changes
        run: |
          if cmp -s "${RUNNER_TEMP}/validated-checkpoints/main-checkpoints.txt" "${MAINNET_CHECKPOINTS}" &&
             cmp -s "${RUNNER_TEMP}/validated-checkpoints/test-checkpoints.txt" "${TESTNET_CHECKPOINTS}"; then
            echo "No changes to commit"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload validated mainnet checkpoints
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: validated-mainnet-checkpoints
          path: ${{ runner.temp }}/validated-checkpoints/main-checkpoints.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated testnet checkpoints
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: validated-testnet-checkpoints
          path: ${{ runner.temp }}/validated-checkpoints/test-checkpoints.txt
          if-no-files-found: error
          retention-days: 7

  # Opens or updates the checkpoint PR. The App token is minted only after the validated
  # files have been downloaded outside the checkout and checked again as data.
  open-pr:
    name: Open checkpoint update PR
    needs: [resolve-run, validate-checkpoints]
    if: needs.validate-checkpoints.outputs.has_changes == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false
          ref: main

      - name: Download validated mainnet checkpoints
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: validated-mainnet-checkpoints
          path: ${{ runner.temp }}/validated/mainnet

      - name: Download validated testnet checkpoints
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: validated-testnet-checkpoints
          path: ${{ runner.temp }}/validated/testnet

      # Re-run the data checks: the merged files must be the current checkpoint files plus
      # valid new entries. This also catches `main` moving since the validation job ran.
      - name: Apply validated checkpoint files
        run: |
          .github/scripts/merge-checkpoint-artifact.sh \
            "${RUNNER_TEMP}/validated/mainnet" main-checkpoints.txt "${MAINNET_CHECKPOINTS}" "${MAINNET_CHECKPOINTS}"
          .github/scripts/merge-checkpoint-artifact.sh \
            "${RUNNER_TEMP}/validated/testnet" test-checkpoints.txt "${TESTNET_CHECKPOINTS}" "${TESTNET_CHECKPOINTS}"
          git diff --stat

      - name: Check the release app configuration
        if: vars.RELEASE_APP_ID == ''
        run: |
          echo "::error::Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY. The app token is required to open the checkpoint update PR."
          exit 1

      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create checkpoint update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 #v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-checkpoints
          add-paths: |
            zebra-chain/src/parameters/checkpoint/main-checkpoints.txt
            zebra-chain/src/parameters/checkpoint/test-checkpoints.txt
          title: "chore(chain): update checkpoints"
          body: |
            Automated checkpoint update from the integration test run.

            **Source:** [Integration test run #${{ needs.resolve-run.outputs.run_id }}](${{ needs.resolve-run.outputs.run_url }})

            Checkpoints are consensus-critical. Verify the new hashes against the source run before merging.
          labels: release
          commit-message: "chore(chain): update checkpoints"
          delete-branch: true
