# Attaches a prepared `release-binaries` workflow artifact to an existing
# GitHub release. Binary construction and signing belong to
# `zfnd-release-binaries.yml`. Existing release assets are never replaced.
name: Attach release binaries (reusable)

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Existing GitHub release tag that receives the binaries"
        required: true
        type: string

permissions: {}

jobs:
  attach:
    name: Attach release binaries
    if: >-
      ${{
        github.repository == 'ZcashFoundation/zebra' &&
        github.event_name == 'release' &&
        startsWith(inputs.release_tag, 'v') &&
        inputs.release_tag == github.event.release.tag_name
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # attach assets to the existing release
      attestations: read # verify archive provenance
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify the release binary bundle
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity="https://github.com/${REPOSITORY}/.github/workflows/zfnd-release-binaries.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-repository="${REPOSITORY}" \
            --certificate-github-workflow-sha="${GITHUB_SHA}"
          sha256sum --check --strict SHA256SUMS
          for sidecar in *.tar.gz.sha256; do
            sha256sum --check --strict "${sidecar}"
          done
          for archive in *.tar.gz; do
            gh attestation verify "${archive}" \
              --repo "${REPOSITORY}" \
              --signer-workflow "${REPOSITORY}/.github/workflows/zfnd-release-binaries.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --source-digest "${GITHUB_SHA}"
          done

      - name: Check that the release has no assets yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" --json assets --jq '.assets[].name')"
          if [ -n "${existing}" ]; then
            echo "::error::${RELEASE_TAG} already has assets, which are never replaced. See 'If Binary Attachment Fails' in book/src/dev/release-process.md."
            printf '%s\n' "${existing}"
            exit 1
          fi

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS dist/SHA256SUMS.sigstore.json \
            --repo "${REPOSITORY}"
