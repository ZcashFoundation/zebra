# Measures ziff (github.com/ZcashFoundation/ziff) against cargo-semver-checks on already-merged PRs to decide with data whether ziff becomes the gate engine; runs never appear on contributor PRs.
name: Ziff Replay

on:
  workflow_dispatch:
  schedule:
    - cron: "17 04 * * 2"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PUBLIC_API_VERSION: 0.52.0
      ZIFF_TOOLCHAIN: nightly-2026-06-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout ziff
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ZcashFoundation/ziff
          ref: 47d1ecb341e62811487b35b15dde83e578c403ff
          path: ziff
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly-2026-06-15
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --version "$CARGO_PUBLIC_API_VERSION" --locked
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target/ziff-cache
          key: ziff-${{ runner.os }}-nightly-2026-06-15-${{ hashFiles('.github/ziff-replay-set.json') }}
      - name: Replay ziff
        env:
          OUT_DIR: target/ziff-replay
          REPLAY_SET: .github/ziff-replay-set.json
          ZIFF: ziff/ziff
        run: |
          set -euo pipefail

          chmod +x "$ZIFF"
          mkdir -p "$OUT_DIR"

          {
            echo "| PR | Exit | Verdict | API breaking | Seconds |"
            echo "| --- | ---: | --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          failures=0
          while IFS= read -r entry; do
            pr="$(jq -r '.pr' <<< "$entry")"
            base="$(jq -r '.base' <<< "$entry")"
            head="$(jq -r '.head' <<< "$entry")"
            json_file="$OUT_DIR/pr-${pr}.json"
            stderr_file="$OUT_DIR/pr-${pr}.stderr"
            start="$(date +%s)"

            set +e
            "$ZIFF" --json "$base" "$head" > "$json_file" 2> "$stderr_file"
            exit_code="$?"
            set -e

            seconds="$(($(date +%s) - start))"
            if jq empty "$json_file" >/dev/null 2>&1; then
              verdict="$(jq -r '.verdict // "unknown"' "$json_file")"
              api_breaking="$(jq -r '.totals.api_breaking // 0' "$json_file")"
            else
              verdict=invalid-json
              api_breaking=0
              failures=1
            fi

            echo "| #$pr | $exit_code | $verdict | $api_breaking | $seconds |" >> "$GITHUB_STEP_SUMMARY"

            case "$exit_code" in
              0|1)
                ;;
              2|64)
                failures=1
                ;;
              *)
                failures=1
                ;;
            esac
          done < <(jq -c '.[]' "$REPLAY_SET")

          if (( failures > 0 )); then
            exit 1
          fi
      - name: Upload raw ziff JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ziff-replay-json
          path: target/ziff-replay/*.json
          if-no-files-found: warn
          retention-days: 14
