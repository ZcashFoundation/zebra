# Keep `next` current with `main` through a reviewable pull request.
#
# After each push to `main`, moves the `sync/main-to-next` branch up to `main` and opens or
# updates its pull request into `next` for a maintainer to merge. See
# book/src/dev/next-branch.md.
name: Sync main to next

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    name: Open or update the sync pull request
    # `github.sha` is the commit to sync, so a manual run must start from `main`.
    if: github.repository_owner == 'ZcashFoundation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # A pull request opened with GITHUB_TOKEN never starts the required checks, so it
      # could never merge.
      - name: Generate release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
          SYNC_BRANCH: sync/main-to-next
        run: |
          AHEAD=$(gh api "repos/${REPO}/compare/next...${MAIN_SHA}" --jq '.ahead_by')
          if [ "${AHEAD}" -eq 0 ]; then
            echo "next already contains every commit on main."
            exit 0
          fi

          # Create the branch, or fast-forward it, or merge main into it once a maintainer's
          # conflict resolution blocks the fast-forward. Never force it over that resolution.
          BEHIND_MAIN=false
          if ! gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${SYNC_BRANCH}" -f sha="${MAIN_SHA}" --silent 2>/dev/null &&
            ! gh api -X PATCH "repos/${REPO}/git/refs/heads/${SYNC_BRANCH}" -f sha="${MAIN_SHA}" -F force=false --silent 2>/dev/null &&
            ! MERGE=$(gh api "repos/${REPO}/merges" -f base="${SYNC_BRANCH}" -f head="${MAIN_SHA}" --silent 2>&1); then
            if [[ "${MERGE}" != *"HTTP 409"* ]]; then
              echo "${MERGE}"
              exit 1
            fi
            BEHIND_MAIN=true
          fi

          # `gh pr list --head` matches the branch name in any fork. The REST filter takes the owner.
          PR=$(gh api "repos/${REPO}/pulls?state=open&base=next&head=${OWNER}:${SYNC_BRANCH}" \
            --jq '.[0].html_url // empty')
          if [ -z "${PR}" ]; then
            PR=$(gh pr create --repo "${REPO}" --base next --head "${SYNC_BRANCH}" \
              --title "chore: sync main to next" --body-file - <<'BODY'
          Brings the commits merged to `main` into `next`. A maintainer reviews it and merges it with a merge commit, which deploys the `next` nodes.

          If it conflicts with `next`, resolve the conflicts on this pull request's branch. The steps are in [The `next` branch](https://github.com/ZcashFoundation/zebra/blob/main/book/src/dev/next-branch.md#resolve-sync-conflicts).
          BODY
            )
          fi
          echo "Sync pull request ${PR} has ${AHEAD} commit(s) from main."

          # The branch no longer carries every commit on main, so a draft keeps it from
          # being merged as if it did.
          if [ "${BEHIND_MAIN}" = true ]; then
            gh pr ready "${PR}" --undo
            echo "::warning::main conflicts with ${SYNC_BRANCH}, so ${PR} is a draft. Merge main into the branch, as described in its body."
          fi

          # GitHub computes mergeability asynchronously after the head moves.
          MERGEABLE=UNKNOWN
          for _ in $(seq 1 6); do
            MERGEABLE=$(gh pr view "${PR}" --json mergeable --jq '.mergeable')
            [ "${MERGEABLE}" != "UNKNOWN" ] && break
            sleep 10
          done
          if [ "${MERGEABLE}" = "CONFLICTING" ]; then
            echo "::warning::Sync pull request ${PR} conflicts with next. Resolve it on ${SYNC_BRANCH}, as described in its body."
          fi
