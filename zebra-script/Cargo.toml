[package]
name = "zebra-script"
version = "15.0.0"
authors.workspace = true
description = "Zebra transparent script verification with the Rust zcash_script interpreter"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../README.md"
homepage.workspace = true
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["cryptography::cryptocurrencies"]

[dependencies]
zcash_script = { workspace = true }
zcash_primitives = { workspace = true }
zcash_transparent = { workspace = true }
zebra-chain = { path = "../zebra-chain", version = "16.0.0" }

thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
lazy_static = { workspace = true }
ripemd = { workspace = true }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
zebra-test = { path = "../zebra-test" }

# The tests build transactions with `Transaction::test_v*`, which are gated behind this feature.
zebra-chain = { path = "../zebra-chain", version = "16.0.0", features = ["proptest-impl"] }

[lints]
workspace = true
