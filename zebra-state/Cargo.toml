[package]
name = "zebra-state"
version = "16.0.0"
authors.workspace = true
description = "State contextual verification and storage code for Zebra"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../README.md"
homepage.workspace = true
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["asynchronous", "caching", "cryptography::cryptocurrencies"]

[features]

# Production features that activate extra dependencies, or extra features in dependencies

progress-bar = [
    "howudoin",
]

# Indexes spending transaction ids by spent outpoints and revealed nullifiers
indexer = ["zebra-db/indexer"]

# Test-only features
proptest-impl = [
    "proptest",
    "proptest-derive",
    "zebra-test",
    "zebra-chain/proptest-impl",
    "zebra-db/proptest-impl",
]

# Experimental elasticsearch support
elasticsearch = [
    "dep:elasticsearch",
    "dep:serde_json",
    "zebra-chain/elasticsearch",
    "zebra-db/elasticsearch",
]

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
futures = { workspace = true }
hashbrown = { workspace = true }
hex = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
metrics = { workspace = true }
mset = { workspace = true }
semver = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true, features = ["serde_derive"] }
tempfile = { workspace = true }
thiserror = { workspace = true }

rayon = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "tracing", "macros", "time"] }
tower = { workspace = true, features = ["buffer", "util"] }
tracing = { workspace = true }

sapling-crypto = { workspace = true }

# elasticsearch specific dependencies.
# Security: avoid default dependency on openssl
elasticsearch = { workspace = true, features = ["rustls-tls"], optional = true }
serde_json = { workspace = true, optional = true }

zebra-node-services = { path = "../zebra-node-services", version = "13.0.0" }
zebra-chain = { path = "../zebra-chain", version = "15.0.0", features = ["async-error"] }
zebra-db = { path = "../zebra-db", version = "0.1.0" }

# prod feature progress-bar
howudoin = { workspace = true, optional = true }

# test feature proptest-impl
zebra-test = { path = "../zebra-test/", version = "5.0.0", optional = true }
proptest = { workspace = true, optional = true }
proptest-derive = { workspace = true, optional = true }
derive-getters.workspace = true

[dev-dependencies]
bincode = { workspace = true }
color-eyre = { workspace = true }
hex-literal = { workspace = true }
rocksdb = { workspace = true, features = ["lz4"] }
serde-big-array = { workspace = true }
zcash_history = { workspace = true }

once_cell = { workspace = true }
spandoc = { workspace = true }

hex = { workspace = true, features = ["serde"] }
insta = { workspace = true, features = ["ron", "redactions"] }

proptest = { workspace = true }
proptest-derive = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

halo2 = { package = "halo2_proofs", version = "0.4" }
jubjub = { workspace = true }

tokio = { workspace = true, features = ["full", "tracing", "test-util"] }

zebra-chain = { path = "../zebra-chain", features = ["proptest-impl"] }
zebra-db = { path = "../zebra-db", features = ["proptest-impl"] }
zebra-test = { path = "../zebra-test/" }

[lints]
workspace = true
