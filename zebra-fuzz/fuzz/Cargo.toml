[package]
name = "zebra-fuzz-targets"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

# The dependency set is the union of the crates imported by the fuzz targets.
# Inherit shared dependencies so API changes cannot leave the harnesses pinned
# to a different version from the node crates.
[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# zebra crates, by path into this repository
zebra-chain = { path = "../../zebra-chain", features = ["proptest-impl"] }
zebra-network = { path = "../../zebra-network", features = ["fuzzing"] }
zebra-consensus = { path = "../../zebra-consensus", features = ["fuzzing"] }
zebra-rpc = { path = "../../zebra-rpc" }
zebra-state = { path = "../../zebra-state", features = ["proptest-impl"] }
zebra-node-services = { path = "../../zebra-node-services" }
zebra-script = { path = "../../zebra-script" }

# rpc_handler_fuzz / jsonrpsee_envelope_fuzz async harness deps
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tower = { workspace = true, features = ["buffer", "util"] }
futures = { workspace = true }
jsonrpsee = { workspace = true, features = ["server"] }
serde_json = { workspace = true }

# structure-aware oracle support
proptest = { workspace = true }
# address_fuzz third oracle uses zebra-chain's address conversion traits.
zcash_address = { workspace = true }
# note_commitment_tree_fuzz tree types
halo2 = { workspace = true }
sapling-crypto = { workspace = true }
# rpc_handler_fuzz / jsonrpsee_envelope_fuzz timestamp handling
chrono = { workspace = true }
# equihash_fuzz multi-param oracle
equihash = { workspace = true }
# script_flag_matrix_fuzz: below-zebra-script FFI flag matrix
libzcash_script = { workspace = true }
zcash_script = { workspace = true, features = ["signature-validation"] }
hex = { workspace = true }
# p2p_*/addr_message_fuzz: wire Codec Decoder/Encoder traits + BytesMut buffer
bytes = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
# generate_v6_seeds bundle types
orchard = { workspace = true }
zcash_protocol = { workspace = true }

[[bin]]
name = "rpc_handler_fuzz"
path = "fuzz_targets/rpc_handler_fuzz.rs"
test = false
doc = false

[[bin]]
name = "jsonrpsee_envelope_fuzz"
path = "fuzz_targets/jsonrpsee_envelope_fuzz.rs"
test = false
doc = false

[[bin]]
name = "script_verify_fuzz"
path = "fuzz_targets/script_verify_fuzz.rs"
test = false
doc = false

[[bin]]
name = "script_flag_matrix_fuzz"
path = "fuzz_targets/script_flag_matrix_fuzz.rs"
test = false
doc = false

[[bin]]
name = "address_fuzz"
path = "fuzz_targets/address_fuzz.rs"
test = false
doc = false

[[bin]]
name = "note_commitment_tree_fuzz"
path = "fuzz_targets/note_commitment_tree_fuzz.rs"
test = false
doc = false

[[bin]]
name = "equihash_fuzz"
path = "fuzz_targets/equihash_fuzz.rs"
test = false
doc = false

# Block- and P2P-codec targets carried over from Milestone 1.
[[bin]]
name = "block_deserialize"
path = "fuzz_targets/block_deserialize.rs"
test = false
doc = false

[[bin]]
name = "block_deep_fuzz"
path = "fuzz_targets/block_deep_fuzz.rs"
test = false
doc = false

[[bin]]
name = "p2p_message_parse"
path = "fuzz_targets/p2p_message_parse.rs"
test = false
doc = false

[[bin]]
name = "p2p_deep_fuzz"
path = "fuzz_targets/p2p_deep_fuzz.rs"
test = false
doc = false

[[bin]]
name = "addr_message_fuzz"
path = "fuzz_targets/addr_message_fuzz.rs"
test = false
doc = false

[[bin]]
name = "v6_transaction_fuzz"
path = "fuzz_targets/v6_transaction_fuzz.rs"
test = false
doc = false

[[bin]]
name = "v6_transaction_semantic_fuzz"
path = "fuzz_targets/v6_transaction_semantic_fuzz.rs"
test = false
doc = false

[[bin]]
name = "ironwood_value_balance_codec_fuzz"
path = "fuzz_targets/ironwood_value_balance_codec_fuzz.rs"
test = false
doc = false

# Helper binary (NOT a fuzz target): emits structural-diversity v6/Ironwood seeds.
# Build with plain `cargo build --release --bin generate_v6_seeds`, then run
# `generate_v6_seeds <dir>` and drop the output into the v6_transaction_fuzz and
# v6_transaction_semantic_fuzz corpus dirs.
[[bin]]
name = "generate_v6_seeds"
path = "seed_gen.rs"
doc = false
