[package]
name = "zebra-utils"
version = "10.0.4"
authors.workspace = true
description = "Developer tools for Zebra maintenance and testing"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# zebra-utils has a separate README file
readme = "README.md"
homepage.workspace = true
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "zebra-checkpoints"
# this setting is required for Zebra's Docker build caches
path = "src/bin/zebra-checkpoints/main.rs"
required-features = ["zebra-checkpoints"]

[[bin]]
name = "known-hashes"
# this setting is required for Zebra's Docker build caches
path = "src/bin/known-hashes/main.rs"
required-features = ["known-hashes"]

[[bin]]
name = "search-issue-refs"
path = "src/bin/search-issue-refs/main.rs"
required-features = ["search-issue-refs"]

[[bin]]
name = "spentness-hints"
path = "src/bin/spentness-hints/main.rs"
required-features = ["spentness-hints"]

[[bin]]
name = "block-template-to-proposal"
# this setting is required for Zebra's Docker build caches
path = "src/bin/block-template-to-proposal/main.rs"

[features]
default = []

# Each binary has a feature that activates the extra dependencies it needs

zebra-checkpoints = [
    "itertools",
    "tokio",
    "zebra-chain/json-conversion",
    "zebra-node-services/rpc-client"
]

known-hashes = [
    "tokio",
    "zebra-node-services/rpc-client"
]

spentness-hints = [
    "rocksdb",
    "sha2",
    "tempfile",
    "zebra-state"
]

# Matches the state's experimental elasticsearch indexing, which changes its API
elasticsearch = ["zebra-state?/elasticsearch"]

search-issue-refs = [
    "regex",
    "reqwest",
    "tokio"
]

[dependencies]
color-eyre = { workspace = true }

clap = { workspace = true, features = ["derive"] }
hex = { workspace = true }
serde_json = { workspace = true }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

zebra-node-services = { path = "../zebra-node-services", version = "13.0.0" }
zebra-chain = { path = "../zebra-chain", version = "15.0.0" }

# These crates are needed for the block-template-to-proposal binary
zebra-rpc = { path = "../zebra-rpc", version = "19.0.0" }

# These crates are needed for the zebra-checkpoints binary
itertools = { workspace = true, optional = true }

# These crates are needed for the spentness-hints binary
rocksdb = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
zebra-state = { path = "../zebra-state", version = "16.0.0", optional = true }

# These crates are needed for the search-issue-refs binary
regex = { workspace = true, optional = true }
# Avoid default openssl dependency to reduce the dependency tree and security alerts.
reqwest = { workspace = true, features = ["rustls-tls"], optional = true }

# These crates are needed for the zebra-checkpoints, known-hashes, and search-issue-refs binaries
tokio = { workspace = true, features = ["full"], optional = true }

zcash_primitives = { workspace = true, optional = true }
zcash_protocol.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
zebra-state = { path = "../zebra-state", version = "16.0.0", features = ["proptest-impl"] }

zebra-test = { path = "../zebra-test/", version = "5.0.0" }

[lints]
workspace = true
