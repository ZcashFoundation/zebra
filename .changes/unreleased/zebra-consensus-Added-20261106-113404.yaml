project: zebra-consensus
kind: Added
body: >-
  Added `router::init_with_limits`, which initializes the verifiers like `router::init` with a
  byte capacity for the block verifier's cache of successful block proposals and its active
  proposal and mined-submission work, and `DEFAULT_PROPOSAL_CACHE_BYTES`, the capacity `router::init` keeps
  (8 × 72 MiB). Work is admitted before block deserialization, through
  `PreparedBlockCache::deserialize_proposal` and `deserialize_with_admission`, and held until
  verification finishes; a proposal that doesn't fit returns memory pressure, a mined submission
  waits up to 30 seconds for capacity, and a cancelled request stops before its transaction
  checks start. A capacity smaller than one proposal's charge caches no proposal. An optional
  checkpoint tip makes the checkpoint verifier fast-forward like
  `router::init_with_checkpoint_tip`.
