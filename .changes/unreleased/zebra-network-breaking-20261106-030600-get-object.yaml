project: zebra-network
kind: breaking
body: 'Added `Request::Object` for a byte range of a content-addressed synchronization artifact, with the answers `Response::Object` and `Response::ObjectNotFound`, and the errors `PeerError::RequestOutOfBounds` (a request outside the protocol''s bounds, which is never sent) and `PeerError::RequestRefused` (a peer''s refusal of an object request, which is not misbehavior); update exhaustive matches on `Request`, `Response`, and `PeerError`. `Response::Object` can carry fewer bytes than requested: the responder may finish early, and an answer that the request''s deadline or a reset cuts off after its size arrived keeps the data received. Object requests use the draft version 2 protocol''s `get-object` stream, and the peer set sends them only to version 2 peers that advertise the new `PeerServices::NODE_SYNC_ARTIFACTS`. Added the runtime-only `Config::object_source`, the artifacts this node serves, which config files never contain; set it to `None` in struct literals. Added the crate-root types `ObjectSource` (made with `ObjectSource::channel`), `ObjectIndex`, and `ObjectEntry` for it, and re-exported zebra-chain''s `ObjectHash`.'
