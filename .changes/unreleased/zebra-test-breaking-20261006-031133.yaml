project: zebra-test
kind: breaking
body: >-
  Enforced `command::TestChild::with_timeout` for quiet and partial-line reads and
  natural process exit. It now returns a `Result`, rejecting unrepresentable deadlines with
  `InvalidInput` rather than panicking. Made `TestChild::{deadline, timeout}` private; use
  `with_timeout` to change the budget and `deadline()` to inspect it. Reset timeouts between
  startup and longer observation phases; existing output readers are updated immediately.
  `wait_with_output` drains both remaining streams, with an independent one-second cleanup grace
  after intentional termination or natural exit. Cleanup no longer requires renewing the observation
  timeout. Changed `TestChild::{stdout, stderr}` to `Option<command::ChildOutput>` and removed
  `command::IteratorDebug`; use the `TestChild` output methods instead of custom iterators.
  Bounded reaping and draining in `TestChild::{kill_and_return_output, kill_and_consume_output}`
  to one second; returned output retains line endings.
  ([#11598](https://github.com/ZcashFoundation/zebra/pull/11598))
