body: "`parameters::subsidy::funding_stream_address_period` now returns signed `HeightDiff` and floors negative periods; subtract periods before converting to an unsigned funding-address index. ZIP 207 triples the remaining partial address period at NU7, then uses 105,000-block periods on the public schedule. Canonical ZIP 214 revision-2 streams active at NU7 end at the adjusted third halving; expired streams are not reactivated and explicit custom ranges are preserved. ([#11529](https://github.com/ZcashFoundation/zebra/pull/11529))"
