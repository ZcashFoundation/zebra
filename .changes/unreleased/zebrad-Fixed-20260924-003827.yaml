project: zebrad
kind: Changed
body: 'Single-block downloads now wait for eligible busy peers within the request timeout without exhausting missing-block retries. Zebra prefers responsive peers that serve historic blocks, still tries ready pruned peers when advertisements are lost, and waits for busy pruned peers only if some peer advertised the block. Immediate refusals are counted in the `zcash.net.peer_set.inventory_refusal` metric.'
