project: zebrad
kind: Fixed
body: 'Block downloads no longer stall near the chain tip while every peer that serves historic blocks is busy. Previously Zebra either sent the request to a peer that could not serve it or refused it instantly, so the syncer dropped the next block and waited 8 minutes before restarting the sync. Zebra now prefers peers that serve historic blocks, sends the request to a busy one as soon as it is ready, and reports refusals in the `zcash.net.peer_set.inventory_refusal` metric.'
time: 2026-09-24T00:38:27.544659485Z
