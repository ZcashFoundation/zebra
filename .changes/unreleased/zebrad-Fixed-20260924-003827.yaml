project: zebrad
kind: Changed
body: 'Single-block downloads try another eligible peer after a missing-block response, even when inventory updates are lost, and wait for busy peers without spending missing-block retries. Correct missing-block responses no longer penalize a peer for unrelated blocks. Ready pruned peers remain eligible; busy pruned peers require an advertisement. ([#11520](https://github.com/ZcashFoundation/zebra/pull/11520))'
