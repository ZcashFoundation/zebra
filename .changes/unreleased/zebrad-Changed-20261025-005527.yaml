project: zebrad
kind: Changed
body: >-
  Nodes with pruned block history no longer advertise archive service, return `notfound` for
  unavailable blocks, and stop block inventory at missing history while continuing to serve headers.
  Alternate listener addresses learned during handshakes retain their advertised capabilities,
  rather than being relabeled as archive peers. `getnetworkinfo` reports the services the node
  advertises in `localservices`. With a retention of at least 2,304 blocks, a pruned node
  advertises limited service (`NODE_NETWORK_LIMITED`) to version 2 peers. The zcashd sidecar mode
  requires an archive node.
time: 2026-10-25T00:55:27.185483328+02:00
