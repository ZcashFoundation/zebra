project: zebra-consensus
kind: Security
body: >-
  Check that a block's header commits to its coinbase height before the checkpoint and semantic
  verifiers use that height, so a body with a rewritten height is rejected as not matching its
  header, instead of being dropped as already verified or finished, or checked or queued at
  another height
  ([GHSA-g9rc-89v4-hhvf](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-g9rc-89v4-hhvf),
  [GHSA-hvw5-x88g-2q8w](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-hvw5-x88g-2q8w)).
time: 2026-11-06T12:00:00.000000000+00:00
