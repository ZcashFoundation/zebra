project: zebra-state
kind: Changed
body: "From NU7 activation, ordinary builds credit the NSM with 60% of aggregate transaction fees, rounded down. From the configured NSM reissuance height, contextual payout validation uses the exact parent reserve and rejects coinbases that claim the withheld fees ([#11487](https://github.com/ZcashFoundation/zebra/pull/11487), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
