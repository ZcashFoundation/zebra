project: zebra-chain
kind: breaking
body: '`parameters::testnet::ParametersBuilder::extend_funding_streams` now returns `Result<Self, ParametersBuilderError>`. Builder validation rejects unsupported halving schedules, issuance above the monetary cap, configured NSM reissuance with a zero coefficient, and zero address periods when funding streams are configured. `with_halving_interval` requires an interval in `1..=HeightDiff::MAX / 6` to keep post-NU7 arithmetic representable. ([#11514](https://github.com/ZcashFoundation/zebra/pull/11514))'
