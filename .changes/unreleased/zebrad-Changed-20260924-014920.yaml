body: Invalid custom subsidy schedules and funding address periods return configuration errors instead of panicking or stalling later. Schedules must remain within the monetary cap and configured NSM reissuance must have a positive coefficient; valid streamless networks can still use short halving intervals. ([#11514](https://github.com/ZcashFoundation/zebra/pull/11514))
