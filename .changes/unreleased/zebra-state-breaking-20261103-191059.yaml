project: zebra-state
kind: breaking
body: >-
  Replaced the fixed three-byte `Height` disk encoding with a canonical length-prefixed minimal
  big-endian encoding that preserves numeric key order and supports every `u32`. `MAX_ON_DISK_HEIGHT`
  is now `Height::MAX`. The `IntoDisk::Bytes` associated types for heights, transaction and output
  locations, and their transparent address composites and balance values are now `Vec<u8>` instead
  of fixed arrays. State format v33 migrates every affected key and value in 25 column
  families, above the v32 snapshot barrier, and prefers reusable v32 sources with v30/v29
  fallbacks. Direct readers must use v33-or-newer code and wait for the writer to finish. v32 and
  older readers cannot decode v33 records. `SNAPSHOT_FORMAT` is now 2, because state snapshots
  carry the new record encoding.
  ([#12182](https://github.com/ZcashFoundation/zebra/pull/12182))
