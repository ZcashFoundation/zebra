project: zebrad
kind: Changed
body: 'Build a coinbase-only block template on top of a new block from a peer as soon as its proof of work is checked, while its transactions are being verified, and serve it to miners as soon as the block is committed, without waiting for a template build. Miners never get a template on a block that is still being verified, and keep the previous template if the block is rejected.'
