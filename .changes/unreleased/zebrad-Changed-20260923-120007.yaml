project: zebrad
kind: Changed
body: 'Zebra caches Orchard, Ironwood, and Sapling bundle verification results, so a proof or signature verified when its transaction entered the mempool is not verified again when the block that mines it arrives. The cache is reported by the new `zebra.consensus.cache.*` metrics ([#11380](https://github.com/ZcashFoundation/zebra/pull/11380)).'
