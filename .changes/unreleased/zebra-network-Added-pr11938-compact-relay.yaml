body: Added negotiated compact-block messages and bounded block reconstruction using witnessed transaction identities. Successful reconstruction returns an immutable `ReconstructedBlock` carrying its exact bounded serialized size and transaction-Merkle evidence, sealed to the same block allocation for later verification ([#11938](https://github.com/ZcashFoundation/zebra/pull/11938)).
