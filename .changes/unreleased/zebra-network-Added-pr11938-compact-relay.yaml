project: zebra-network
kind: Added
body: 'Added compact-block encoding and bounded witnessed-identity reconstruction ([#12290](https://github.com/ZcashFoundation/zebra/pull/12290)). Negotiated compact-block messages, `Request::{AdvertiseCompactBlock, CheckCompactBlock, CheckCompactHeader, CompactBlockTransactions}`, and `Response::{CompactBlockTransactions, ReconstructedBlock}` are supported ([#11938](https://github.com/ZcashFoundation/zebra/pull/11938)). Successful reconstruction returns shared `zebra_node_services::compact::ReconstructedBlock` evidence carrying exact size and allocation-bound transaction-Merkle checks ([#11998](https://github.com/ZcashFoundation/zebra/pull/11998)). Compact relay uses at most three receive sources, credits announcements only after local commitment, and releases demoted or failed delivery slots before peer writes; delivered blocks retain a shared block-size recovery budget for fifteen seconds even after publication withdrawal, with expired snapshots released before connection cleanup ([#11981](https://github.com/ZcashFoundation/zebra/pull/11981)).'
