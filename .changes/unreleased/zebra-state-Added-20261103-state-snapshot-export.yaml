project: zebra-state
kind: Added
body: Added `state_snapshot::export::export_state_snapshot`, which exports a read-only finalized state at its tip as a deterministic state snapshot, the `state_snapshot::store::ArtifactStore` that holds snapshot objects by hash with verified reads and rejection marks, and `state_snapshot::format::{canonical_value, window_start}` for the canonical encodings and the window of block hashes and headers a snapshot ships. A snapshot ships the bodies of genesis and its snapshot block only, so a node that imports it downloads no block body it would not keep.
