project: zebra-consensus
kind: Security
body: >-
  Limit blocks queued for checkpoint verification to about 4 GB of estimated block memory, and
  limit the blocks kept alive by queued, committing, cancelled, or failed requests to four per
  configured checkpoint gap or 2,000 blocks, whichever is greater. Both limits count estimated
  block sizes, not the process's measured memory. When the queue is full, the verifier keeps the
  blocks linked to the next checkpoint and returns `VerifyCheckpointError::QueuedLimit`, which
  doesn't score the peer, for the requests it drops or rejects
  ([GHSA-8qxv-5f2c-452c](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-8qxv-5f2c-452c)).
