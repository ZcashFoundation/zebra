project: zebra-network
kind: Added
body: >-
  Added `MemoryLimits`, `QuicWindows` and `init_with_limits`, which starts the network like
  `init_with_block_gossip_peer_ips` with memory limits: `MemoryLimits::peerset_initial_target_size`
  replaces the configured `peerset_initial_target_size`, which scales every connection limit, and
  `MemoryLimits::quic` sets the flow-control windows of every version 2 (QUIC) connection, no
  smaller than `QuicWindows::compact()`, the smallest windows that still fit one maximum-size
  record and its framing per stream. `MemoryLimits::for_budget` and `minimum_budget_bytes` derive
  targets whose legacy message reservations, version 2 request bodies, and QUIC windows fit their
  share, in both connection directions, with serving windows for nodes that serve synchronization
  artifacts;
  `Config::buffered_request_bytes_for_target` and `peer_target_for_memory` expose the calculation,
  for the version 2 connections a `V2Endpoint` allows. A node that registers its version 2
  connections for the checkpoint sync engine (`Config::v2_sync_peers`) opens and aims for at least
  `MIN_V2_SYNC_OUTBOUND_CONNECTIONS` outbound version 2 connections, whatever its peer target.
  `init` and `init_with_block_gossip_peer_ips` use `MemoryLimits::default()`, which keeps today's
  limits.
