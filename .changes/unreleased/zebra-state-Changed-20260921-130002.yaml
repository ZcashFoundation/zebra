body: '[ZIP 218](https://zips.z.cash/zip-0218) widens the difficulty averaging window from 17 to 102 blocks at NU7, preserving integer rounding without overflowing on Testnet targets and retaining the proof-of-work limit through the initial window boundary. The adjustment span is height-dependent: `POW_ADJUSTMENT_BLOCK_SPAN` is replaced by `MAX_POW_ADJUSTMENT_BLOCK_SPAN` for buffers and `pow_adjustment_block_span()` for the applicable span. ([#11529](https://github.com/ZcashFoundation/zebra/pull/11529))'
