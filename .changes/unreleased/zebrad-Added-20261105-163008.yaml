project: zebrad
kind: Added
body: 'Added the experimental `[sync] v2_spentness_hints` option (`"off"`, `"auto"` or `"require"`, default `"off"`), which builds the UTXO set below the final checkpoint from a pinned spentness-hint artifact fetched from version 2 peers, on a state that starts empty, and needs `sync.v2_checkpoint_sync`. Until hints are acquired or given up, Zebra commits no block above genesis. Nodes with version 2 enabled serve a saved artifact to their version 2 peers with any mode. With any mode, the first start moves the state from `state/v29` to `state/v30` (database format 30.0.0) without resyncing; releases with format 29 cannot use it, so back up `state/v29` before upgrading if you might roll back.'
