body: 'Added `Request::PollPeerSet`, which the peer set sends itself from a new background task, so it routes queued block requests as soon as a busy peer becomes ready. Peers never send it, so services that handle inbound peer requests can treat it as unreachable ([#11521](https://github.com/ZcashFoundation/zebra/pull/11521)).'
