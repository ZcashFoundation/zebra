project: zebra-consensus
kind: Changed
body: Checkpoint admission bounds queued and committing work together and rejects oversized internally constructed blocks. Reservations survive cancellation and unchecked-child recovery. Ordinary duplicate requests retain mined observers as best-effort, including observers returned by late child recovery. `RouterError::is_resource_pressure` identifies local queue pressure without classifying the block as invalid.
