project: zebra-consensus
kind: Changed
body: Checkpoint admission bounds queued and committing work together and rejects oversized internally constructed blocks. Sequential range owners preserve committed prefixes and release uncommitted suffixes after failure so recovery fits the same budget, independently of response cancellation. Monotonic completion reports reconcile surviving ranges after recovery without letting stale reports rewind committed progress. Ordinary duplicate requests retain mined observers as best-effort. `RouterError::is_resource_pressure` identifies local queue pressure and failed-range recovery without classifying the block as invalid.
