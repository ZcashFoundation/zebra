project: zebra-network
kind: breaking
body: >-
  Network configuration now has a runtime-only `Config::local_services` field for truthful version
  and local-address service advertisements. Pass the local service mask to `AddressBook::new` and
  `MetaAddr::new_local_listener_change`. Unset handshake services now use the configured local services.
  Cached alternate listeners retain their advertised service capabilities. The
  `AddressBookPeers::local_services` method exposes the local advertised service mask, defaulting to
  no services for implementations that do not track it.
  Removed `MetaAddr::last_known_info_is_valid_for_outbound`; address admission, gossip, and connection
  candidacy now preserve non-archive listeners, while sync handshakes still require archive service.
  Outside sync, non-archive peers fill at most `peerset_initial_target_size` outbound connections,
  and reconnection candidates that might serve archive history are chosen first.
  Block `getdata` requests are capped before allocation and inbound buffering.
