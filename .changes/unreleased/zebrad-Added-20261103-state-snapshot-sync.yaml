project: zebrad
kind: Added
body: 'Added state-snapshot sync for pruned nodes, on by default (`sync.state_snapshot_sync = true`). An empty node with `state.prune_blocks_older_than` set starts its network and syncs and verifies headers from genesis, then downloads a state snapshot over the version 2 protocol from `sync.state_snapshot_peers`, or when it is empty, over the node''s connections to the version 2 peers that advertise `NODE_SYNC_ARTIFACTS` and hold the snapshot''s manifest, such as `network.initial_v2_peers`, verifies it against a pinned or configured `sync.state_snapshot` commitment and the synced headers, imports it with every synced header from genesis, without the bodies below the snapshot height, commits the block after the snapshot height that it checked too, syncs only the blocks above it, and advertises limited service to version 2 peers once the recent blocks above the snapshot height are finalized (on such a node, `getaddressbalance` omits `received` and `getaddresstxids` covers the blocks above the snapshot height); `sync.state_snapshot_fallback` chooses what happens when that fails: the default `"auto"` syncs normally from the synced headers, so a node always starts, unless a snapshot configured in `sync.state_snapshot` was rejected, which exits; `"error"` always exits and `"genesis"` always syncs from genesis; `sync.unsafe_trust_state_snapshot` allows an unpinned commitment on Mainnet and the default Testnet, and `sync.serve_state_snapshots = true` serves the node''s snapshots to version 2 peers.'
time: 2026-11-03T12:00:00.000000000+00:00
