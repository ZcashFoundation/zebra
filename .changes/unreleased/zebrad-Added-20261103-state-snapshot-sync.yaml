project: zebrad
kind: Added
body: Added experimental state-snapshot sync for pruned nodes. With `sync.state_snapshot_sync = true`, an empty node with `state.prune_blocks_older_than` set downloads a state snapshot over the version 2 protocol from `sync.state_snapshot_peers` (or `network.initial_v2_peers`), verifies it against a pinned or configured `sync.state_snapshot` commitment and the chain, imports it, and syncs only the blocks above it; `sync.state_snapshot_fallback` chooses between exiting and syncing from genesis when that fails, `sync.unsafe_trust_state_snapshot` allows an unpinned commitment on Mainnet and Testnet, and `sync.serve_state_snapshots = true` serves the node's snapshots to version 2 peers and advertises `NODE_SYNC_ARTIFACTS`.
