project: zebrad
kind: Added
body: Added experimental state-snapshot sync for pruned nodes. With `sync.state_snapshot_sync = true`, an empty node with `state.prune_blocks_older_than` set downloads a state snapshot over the version 2 protocol from `sync.state_snapshot_peers` (or `network.initial_v2_peers`), verifies it against a pinned or configured `sync.state_snapshot` commitment and the chain, imports it with the headers from the snapshot height to the next checkpoint that it checked during the bootstrap, commits the block after the snapshot height that it checked too, syncs only the blocks above it, and advertises limited service to version 2 peers once the recent blocks above the snapshot height are finalized (on such a node, `getaddressbalance` omits `received` and `getaddresstxids` covers the blocks above the snapshot height); `sync.state_snapshot_fallback` chooses between exiting and syncing from genesis when that fails, `sync.unsafe_trust_state_snapshot` allows an unpinned commitment on Mainnet and the default Testnet, and `sync.serve_state_snapshots = true` serves the node's snapshots to version 2 peers.
