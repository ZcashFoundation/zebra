project: zebrad
kind: Fixed
body: Fixed supplied Grafana panels, alert rules, and example queries that queried series Zebra doesn't export. The `ZebraHighErrorRate` alert now fires on block verification errors from `sync.block.error.count`, the errors dashboard shows signature and proof verification failures, which the endpoint now exports at zero from startup so the first failures show in `rate()`, the observability README checks `zcash_chain_verified_block_height`, the `RPCHighLatency` alert ignores `getblocktemplate` long polls, and the `SlowHandshakes` alert fires when the p95 successful handshake takes over 2 seconds, below the 3 second handshake timeout.
