project: zebra-chain
kind: breaking
body: 'Handle the new `ParametersBuilderError` funding stream and lockbox variants in exhaustive matches. `ParametersBuilder::extend_funding_streams` returns `InsufficientFundingStreamAddresses` for an empty address list, and `ParametersBuilder::to_network` returns `WrongFundingStreamAddressNetwork` for a non-Testnet address, where both panicked. `Parameters::new_regtest` rejects invalid funding stream addresses and lockbox disbursements, so the infallible `Network::new_regtest` panics on them; use `Parameters::new_regtest` for operator input ([#12048](https://github.com/ZcashFoundation/zebra/pull/12048)).'
time: 2026-10-24T18:45:36.490469817+02:00
