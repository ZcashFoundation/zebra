project: zebra-chain
kind: breaking
body: 'Invalid funding stream and lockbox parameters now return errors instead of panicking. `ParametersBuilderError` gains `MissingFundingStreamDefault`, `InvalidFundingStreamHeightRange`, `InvalidFundingStreamNumerators`, `InvalidFundingStreamAddress`, `WrongFundingStreamAddressNetwork`, `InvalidLockboxDisbursementAddress`, and `InvalidLockboxDisbursementTotal`; add a wildcard arm to exhaustive matches. New `ParametersBuilder::try_with_funding_streams` is the fallible form of `with_funding_streams`. `ParametersBuilder::extend_funding_streams` returns `InsufficientFundingStreamAddresses` for an empty address list, and `ParametersBuilder::to_network` returns `WrongFundingStreamAddressNetwork` for a non-Testnet address, where both panicked. `Parameters::new_regtest` now rejects invalid funding addresses and lockbox disbursements, so the infallible `Network::new_regtest` panics on them; use `Parameters::new_regtest` for operator input.'
time: 2026-10-24T18:45:36.490469817+02:00
