project: zebrad
kind: Added
body: '`getblockchaininfo` and verbose `getblock` responses include `nsmValueBalance`, the Network Sustainability Mechanism (NSM) value balance from NU7, with the block''s change to it in `getblock`. It is not part of `chainSupply` or `valuePools`. As [ZIP 237](https://zips.z.cash/zip-0237) defines it, the balance after the block before NU7 activation is `INITIAL_NSM_VALUE_BALANCE`. ([#12325](https://github.com/ZcashFoundation/zebra/pull/12325))'
