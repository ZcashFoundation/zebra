project: zebra-consensus
kind: breaking
body: >-
  Added `CommitWithRetention`, `CommitEarlyRelayWithRetention`, and `CheckProposalAdmitted`
  block verifier requests. The retention variants carry a `BlockRetentionToken` through accepted
  checkpoint, semantic, and state commit owners; admitted proposals retain their work capacity
  through verification. Code with exhaustive matches on the verifier `Request` enum must handle
  the new variants. Existing request behavior is unchanged.
