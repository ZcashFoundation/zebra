body: '`ReadRequest::TransactionIdsByAddresses` takes an optional `max_entries`, which bounds the address index scan and returns the first transaction IDs in chain order. `ZebraDb::{address_transaction_locations, address_tx_ids, partial_finalized_transparent_tx_ids}` take the same optional limit ([#10686](https://github.com/ZcashFoundation/zebra/issues/10686)).'
