project: zebrad
kind: Changed
body: "Relay submitted blocks before commit only when they match an exact successful local proposal verdict, except for nonce and Equihash solution. Early advertisements use ordinary gossip; all-peer advertisements remain commit-only. State-owned committed notifications survive RPC cancellation, and unavailable notification capacity rejects mined commits before mutation without blocking ordinary commits."
