project: zebrad
kind: Security
body: >-
  Check mempool transactions for unknown anchors and spent nullifiers before verifying their
  proofs, so transactions rejected by those checks no longer add work to the proof batches shared
  with block verification
  ([GHSA-2wx4-g5cf-32pf](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-2wx4-g5cf-32pf)).
  Thanks to @Nathanbyarugaba and @SphereDonout for reporting these issues.
