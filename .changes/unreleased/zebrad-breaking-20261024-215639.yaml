project: zebrad
kind: breaking
body: >-
  Moved to state format v32: v30 isolates pruned state from older readers, and v32 isolates
  snapshot-imported state. Compatible v30 and v29 databases are reused newest first by moving
  their network directory without a resync, even with pruning disabled, and disabling
  old-database cleanup does not prevent the move. A never-pruned, never-snapshot-imported
  archive can return to Zebra 7.0.0 by moving `state/v32/<network>` back to `state/v29/<network>`;
  a pruned or snapshot-born database cannot, so keep a separate archive backup before enabling
  pruning or snapshot sync. Pruning is irreversible; returning to archive operation requires an
  archive snapshot or full resync.
