project: zebrad
kind: breaking
body: >-
  Moved to state format v32: v31 isolates pruned state from older readers, and v32 isolates
  snapshot-imported state. Compatible v31, v30 and v29 databases are reused newest first by moving
  their network directory without a resync, even with pruning disabled, and disabling
  old-database cleanup does not prevent the move. A never-pruned, never-snapshot-imported,
  never-hinted archive can return to Zebra 7.0.0 by moving `state/v32/<network>` back to
  `state/v29/<network>`; a pruned, snapshot-born or hinted database cannot, so keep a separate
  archive backup before enabling pruning, snapshot sync or spentness hints. Pruning is irreversible; returning to archive operation requires an
  archive snapshot or full resync.
