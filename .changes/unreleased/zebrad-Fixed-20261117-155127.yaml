body: Fixed the mempool starting on Mainnet while the node is still far behind the network chain tip. Short sync batches from a node with few useful peers no longer turn it on, because the best tip must also be at most 125 minutes old, the same limit `getblocktemplate` applies. Test networks are unchanged.
