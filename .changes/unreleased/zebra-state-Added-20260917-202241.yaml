project: zebra-state
kind: Added
body: '`ValidateContextError::is_auth_commitment_mismatch()`, which reports whether a block was rejected because its authorizing data does not match its header commitment. It is a dedicated predicate rather than a `misbehavior_score()` test, so callers are not coupled to scoring policy. Also `ValidateContextError::AncestorRejected`, which the state now returns for a queued block whose ancestor failed contextual validation, instead of a copy of the ancestor's error, with `ValidateContextError::for_descendant()` to build it, and `is_descendant_of_auth_commitment_mismatch()` on `ValidateContextError` and `CommitBlockError`.'
time: 2026-09-17T20:22:41.000000000Z
