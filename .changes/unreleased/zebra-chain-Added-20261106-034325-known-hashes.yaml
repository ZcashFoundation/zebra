body: Added `parameters::known_hashes`, with `KnownHashListSpec`, which pins a known-hash list as the SHA-256 of each 50,000-height chunk of `get-hashes` entries and verifies fetched chunks against it, and `chunk_pin`. Regtest and custom testnets take their pins from `KnownHashListSpec::from_config`.
