project: zebra-chain
kind: breaking
body: "`parameters::subsidy::{scheduled_block_subsidy, block_subsidy_with_parent_pools}` expose scheduled and parent-dependent subsidies. NSM issuance is enabled in ordinary builds, including `ValueBalance::{nsm_amount, set_nsm_amount}`. Update `parameters::testnet::RegtestParameters` literals for the formerly gated `initial_nsm_value_balance` and `zip234_deployment_height` fields. The explicit initial reserve is credited at NU7 activation and excluded from issued supply. Omitting the deployment height on a configured network uses its NU7 activation height; `parameters::testnet::Parameters::configured_zip234_deployment_height` returns only the explicit setting, unlike the effective `zip234_deployment_height` accessor. From the reissuance deployment height, context-free `parameters::subsidy::block_subsidy` returns `SubsidyError::ParentChainValuePoolsRequired`; use the parent-aware API for the total subsidy. Update exhaustive matches for `parameters::subsidy::SubsidyError::{Other, ParentChainValuePoolsRequired}` and `value_balance::ValueBalanceError::Nsm` ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
time: 2026-09-15T15:00:00.000000000-06:00
