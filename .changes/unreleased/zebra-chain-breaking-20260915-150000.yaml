project: zebra-chain
kind: breaking
body: "`parameters::subsidy::{scheduled_block_subsidy, block_subsidy_with_parent_pools}` expose scheduled and parent-dependent subsidies. NSM issuance is enabled in ordinary builds, including `ValueBalance::{nsm_amount, set_nsm_amount}`. Update `parameters::testnet::RegtestParameters` literals for the formerly gated `initial_nsm_value_balance` and `nsm_reissuance_height` fields. The explicit initial reserve is credited at NU7 activation and excluded from issued supply. Omitting the reissuance height derives ZIP 237's scheduled-issuance crossover; short custom schedules may have none. Existing accelerated chains must explicitly retain their old reissuance height. `parameters::testnet::Parameters::configured_nsm_reissuance_height` returns only the explicit setting, unlike the effective `nsm_reissuance_height` accessor on `parameters::{Network, testnet::Parameters}`. Use `parameters::testnet::ParametersBuilder::with_nsm_reissuance_height` for explicit overrides and `parameters::subsidy::nsm_reissuance_is_active` to check activation. From the NSM reissuance height, context-free `parameters::subsidy::block_subsidy` returns `SubsidyError::ParentChainValuePoolsRequired`; use the parent-aware API for the total subsidy. Update exhaustive matches for `parameters::subsidy::SubsidyError::{Other, ParentChainValuePoolsRequired}` and `value_balance::ValueBalanceError::Nsm` ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
