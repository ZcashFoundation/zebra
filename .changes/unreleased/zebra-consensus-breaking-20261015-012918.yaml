project: zebra-consensus
kind: breaking
body: '`router::init` and `router::init_test` now return a fifth element, a `PreparedBlockCache` that shares the semantic verifier''s successful proposals; its `deserialize` selects a candidate by normalized header and transaction-section length, then compares exact bytes without a full-body hash pass. Matching proposals reuse parsed transactions while keeping the submitted header and normal consensus verification ([#11738](https://github.com/ZcashFoundation/zebra/issues/11738)).'
