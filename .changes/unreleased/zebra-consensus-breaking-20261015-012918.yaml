project: zebra-consensus
kind: breaking
body: 'The `router::init` and `router::init_test` functions now return a fifth element, a `PreparedBlockCache` sharing successful proposals. Its `reuse` returns a `DecodedBlock` when the complete transaction bytes match a normalized-header candidate, and `DecodedBlock::deserialize` decodes other blocks. Submit it through the new `Request::CommitDecoded` variant to reuse exact identity without hashing the body again, or extract the block with `DecodedBlock::block` for ordinary verification. Cache misses, eviction, proof-of-work, time and live-state checks retain normal validation ([#11738](https://github.com/ZcashFoundation/zebra/issues/11738)).'
