project: zebrad
kind: Security
body: >-
  Limit the combined size of the non-finalized chain indexes, so a long run of blocks filled with
  transparent outputs can't exhaust the node's memory. Past the limit, which ordinary Mainnet
  blocks don't reach, Zebra drops the lowest-work forks, and if the best chain alone is too large,
  it finalizes its oldest blocks early, keeping at least 100. While it does, Zebra can't follow a
  chain reorganization deeper than the blocks it kept. Test networks have a lower limit
  ([GHSA-j8gf-c4rj-6jv5](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-j8gf-c4rj-6jv5)).
