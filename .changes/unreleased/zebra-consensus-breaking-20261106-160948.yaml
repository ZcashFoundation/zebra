project: zebra-consensus
kind: breaking
body: '`sapling_prover()` now returns `&SaplingCoinbaseProver` instead of `&zcash_proofs::prover::LocalTxProver`. The prover supports coinbase outputs only and loads bundled output parameters lazily; Sapling spend proving is unsupported. Production no longer depends on `zcash_proofs` or bundled spend parameters ([#12319](https://github.com/ZcashFoundation/zebra/pull/12319)).'
