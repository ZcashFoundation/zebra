project: zebra-state
kind: breaking
body: 'Added spentness-hint construction of the finalized state (database format 30.0.0, with the new `spentness_journal` and `spentness_artifact` column families; compatible v29 state is moved to `state/v30` without a resync, and 29.x readers cannot use the v30 directory, because a partial hinted state leaves omitted outputs out of the UTXO column family): `init_with_spentness` takes a `SpentnessHintsReceiver` for a verified artifact, below whose pinned terminal checkpoint the finalized writer writes UTXO rows only for the outputs the artifact retains, while address balances, address indexes, value pools and block info stay exact. Also added `SpentnessError`, `ValidateContextError::Spentness`, `CommitCheckpointVerifiedError::spentness_failure`, `ReadStateService::has_incomplete_spentness_hints`, which reports a hinted sync that a restart interrupted, and `ReadStateService::incomplete_spentness_commitment`, the artifact hash that sync must resume with.'
