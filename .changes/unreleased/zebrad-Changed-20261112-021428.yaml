project: zebrad
kind: Changed
body: '`getblock` and `getblockheader` report the tree sizes and roots of blocks that fast checkpoint sync committed without their note commitment trees from the roots and sizes it stored, and so do lightwalletd compact blocks. At those heights, `z_gettreestate` returns error -20 "tree state unavailable: fast-synced height", and the lightwalletd `GetTreeState` and `GetLatestTreeState` methods return `UNAVAILABLE` instead of an empty tree when an active pool tree is missing.'
