body: '`SemanticallyVerifiedBlock` gains a public `received_time: Option<Instant>` field, the local time the block verifier received the block. Code constructing it literally must set it; use `None` for blocks that did not pass through the block verifier ([#11341](https://github.com/ZcashFoundation/zebra/pull/11341)).'
