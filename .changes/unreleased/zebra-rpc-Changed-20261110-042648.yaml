project: zebra-rpc
kind: Changed
body: The template updater serves every build immediately and checks transaction-bearing work in the background, reusing passed verdicts on submit and restoring the last valid work on failure. Fallback templates are also checked in the background. `validate_block_proposal` takes an admission semaphore, and proposal checks time out after 30 seconds.
