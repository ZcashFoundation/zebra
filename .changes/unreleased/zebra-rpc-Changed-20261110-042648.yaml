project: zebra-rpc
kind: Changed
body: The template updater serves every build immediately and checks transaction-bearing work in the background, reusing passed verdicts on submit. Rejected generations, including clock-narrowed responses and RPC fallbacks, restore independent valid work or are withdrawn when none exists. `validate_block_proposal` takes an admission semaphore, and proposal responses time out after 30 seconds.
