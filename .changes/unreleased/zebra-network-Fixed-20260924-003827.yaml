body: '`PeerSet` prefers non-failed block peers, then advertisers and `NODE_NETWORK` peers. Single-block retries retain explicit rejections when inventory updates are lost and try ready pruned peers before refusing. Busy waits exclude banned or outdated peers and include pruned peers only for advertised blocks. Connection-completed outcomes update peer preference; explicit `notfound` remains hash-specific. Immediate refusals remain counted in `zcash.net.peer_set.inventory_refusal`. ([#11520](https://github.com/ZcashFoundation/zebra/pull/11520))'
