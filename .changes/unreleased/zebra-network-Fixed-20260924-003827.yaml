project: zebra-network
kind: Fixed
body: 'When no ready peer advertised the block, `PeerSet` now routes single-hash `BlocksByHash` requests to ready peers that advertised `NODE_NETWORK` before other peers, and queues them while no ready peer can serve the block but a busy peer might have it. A queued request is routed to the first of those busy peers that becomes ready, or refused with a synthetic `NotFoundRegistry` error after `INVENTORY_BUSY_PEER_WAIT_TIMEOUT` (1.5 seconds), or once no busy peer might have the block. Queued requests are counted in the `zcash.net.peer_set.inventory_queued` metric, and refusals in the `zcash.net.peer_set.inventory_refusal` metric.'
