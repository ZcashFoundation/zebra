project: zebra-network
kind: Changed
body: '`PeerSet` prefers ready block advertisers, then responsive `NODE_NETWORK` peers, without excluding ready pruned peers when advertisements are lost. The network service retries busy single-hash `Request::BlocksByHash` requests internally within `constants::REQUEST_TIMEOUT`, preserving caller retries. Busy waits ignore banned or outdated peers and include pruned peers only if some peer advertised the block. Fallback routing deprioritizes peers after failed or cancelled block requests until a block request succeeds. Immediate refusals are counted in the `zcash.net.peer_set.inventory_refusal` metric.'
