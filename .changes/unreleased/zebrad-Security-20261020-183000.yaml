project: zebrad
kind: Security
body: "Update `rustls-webpki` to 0.103.16 and `webpki-roots` to 1.0.10 to distrust the compromised eMudhra intermediate CA keys. Zebra's legacy peer connections and RPC connections do not use TLS, and the experimental version 2 peer-to-peer protocol does not use CA roots, so only outbound HTTPS clients such as the managed `zcashd` download (which is also SHA256-pinned), `sentry`, OpenTelemetry and Elasticsearch are affected."
time: 2026-10-20T18:30:00.000000000Z
