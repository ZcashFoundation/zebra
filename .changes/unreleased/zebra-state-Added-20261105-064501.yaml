project: zebra-state
kind: Added
body: >-
  Added `Config::prune_blocks_older_than`, `Config::state_database_kind()`, and
  `constants::PRUNED_STATE_DATABASE_KIND` for bounded opt-in finalized-body pruning with isolated
  state directories and a shared format version. The `ZebraDb::ready_for_pruning()` gate opens
  only after migrations, spending-index conversion, and initial format checks complete.
  New `StateInitError` variants expose database access errors, conflicting state directories,
  required stopped-node activation, invalid retention, missing history, incompatible spending
  indexes, and required read-only upgrades through `DatabaseAccess`, `ConflictingStateDirectories`,
  `PruningRequiresIsolatedState`, `InvalidPruningRetention`, `PrunedDatabase`,
  `PrunedIndexModeMismatch`, and `ReadOnlyDatabaseNeedsUpgrade`.
