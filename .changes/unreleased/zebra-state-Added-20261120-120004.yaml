body: 'Added `ReadRequest::RawBlocksByHeightRange { start, count }`, which returns up to `count` finalized blocks from `start` as their raw consensus serializations in `ReadResponse::RawBlocks`. It stops at the finalized tip, stops before a block body that is not stored, and fails with `BlockReadError::BlockBodyUnavailable` if that block is at `start`.'
