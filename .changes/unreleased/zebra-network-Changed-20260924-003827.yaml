project: zebra-network
kind: Changed
body: 'Prefer eligible block-serving peers for single-block requests without a ready advertiser. General `BlocksByHash` requests wait up to `INVENTORY_BUSY_PEER_WAIT_TIMEOUT` from enqueueing for busy peers. Queued requests reconsider advertisements and disconnected candidates without requiring unrelated traffic. Banned, outdated, and indefinitely backpressured connections do not suppress fallback. Busy connections that remain unready past `REQUEST_TIMEOUT` are dropped when the peer set is next polled, releasing their connection slots. After queued block requests take the last ready peer, they leave the next one to the request waiting to enter the peer set, so discovery does not wait for every queued block download. Queue and refusal counters include the network label ([#11515](https://github.com/ZcashFoundation/zebra/pull/11515), [#11748](https://github.com/ZcashFoundation/zebra/issues/11748), [#11521](https://github.com/ZcashFoundation/zebra/pull/11521)).'
