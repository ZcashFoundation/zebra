project: zebra-network
kind: Changed
body: 'Prefer block-serving peers for single-block `Request::BlocksByHash` requests without a ready advertiser, and queue the request while an eligible busy peer might have the block. A queued request is routed to the first of those peers that becomes ready, or refused after `INVENTORY_BUSY_PEER_WAIT_TIMEOUT` (1.5 seconds) or once no busy peer might have the block. Busy connections that remain unready past `REQUEST_TIMEOUT` are dropped when the peer set is next polled, releasing their connection slots. Queued requests are counted in `zcash.net.peer_set.inventory_queued` and refusals in `zcash.net.peer_set.inventory_refusal` ([#11515](https://github.com/ZcashFoundation/zebra/pull/11515), [#11748](https://github.com/ZcashFoundation/zebra/issues/11748), [#11521](https://github.com/ZcashFoundation/zebra/pull/11521)).'
