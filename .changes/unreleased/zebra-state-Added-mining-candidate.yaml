project: zebra-state
kind: Added
body: 'Types `MiningCandidateGuard` and `MiningCandidateChanges` support early mining work on a block before verification finishes. Candidates must satisfy contextual difficulty and median-time-past rules before publication. Admission remains reserved until the verifier guard drops, even after work expires; `MiningCandidateChanges::is_current` checks live ownership and expiry before cached work is served.'
