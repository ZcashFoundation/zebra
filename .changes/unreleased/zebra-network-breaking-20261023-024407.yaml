project: zebra-network
kind: breaking
body: Added bilateral compact block relay using `PeerServices::NODE_COMPACT_BLOCKS` (bit 16) from the draft Compact Block Relay ZIP, new request and response variants, and negotiated connection metadata. Initialize the default-on `Config::compact_block_relay` field, handle the new variants in exhaustive matches, and preserve `AuthorizedBlocks` serving authorization until the local write begins. Custom inbound services must answer `Request::EarlyBlocksByHash` like `Request::BlocksByHash`, or set `compact_block_relay` to false, because negotiated peers request blocks with it.
