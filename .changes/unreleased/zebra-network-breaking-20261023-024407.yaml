project: zebra-network
kind: breaking
body: Initialize the default-on `Config::compact_block_relay` setting and the negotiated `ConnectionInfo::early_block_relay` field in struct literals. Handle the new early-relay request and response variants and `PeerError::InboundOnlyRequest` in exhaustive matches. Custom inbound services must answer `Request::EarlyBlocksByHash` like `Request::BlocksByHash`, or disable compact relay. Preserve `AuthorizedBlocks` authorization until the local write begins and supply the source in `Request::AdvertiseEarlyBlock` to exclude the delivering peer ([#11932](https://github.com/ZcashFoundation/zebra/pull/11932)).
