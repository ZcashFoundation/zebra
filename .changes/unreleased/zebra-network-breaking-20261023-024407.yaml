project: zebra-network
kind: breaking
body: Added bilateral compact block and early relay, new request and response variants, and negotiated connection metadata. Initialize the default-on `Config::compact_block_relay` field and use the renamed `PeerServices::NODE_COMPACT_BLOCKS` flag at bit 16, as assigned by the draft Compact Block Relay ZIP. Handle the new variants in exhaustive matches and preserve `AuthorizedBlocks` serving authorization until the local write begins. Rejected compact announcements consume the same per-connection cooldown as accepted announcements. Custom inbound services must answer `Request::EarlyBlocksByHash` like `Request::BlocksByHash`, or set `compact_block_relay` to false, because negotiated peers request blocks with it.
