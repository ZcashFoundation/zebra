body: Handle `Request::{EarlyRelay, AuthenticateEarlyRelay, RejectBlock}`, `Response::{EarlyRelay, Rejected}` and the `EarlyRelayCache` variants of `ReadRequest` and `ReadResponse` in exhaustive matches. Set `Request::EarlyRelay::origin` explicitly. Required authentication accepts parents in any published non-finalized chain; optional publication and serving require the current best tip. Send `RejectBlock` only after authenticating deterministic verifier failures. `FinalizedState::commit_finalized` takes a `CheckpointVerifiedBlock` and optional previous trees; callers publish the tip before sending completion notifications ([#12288](https://github.com/ZcashFoundation/zebra/pull/12288)).
