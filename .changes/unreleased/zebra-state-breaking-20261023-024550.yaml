project: zebra-state
kind: breaking
body: Added authenticated early-relay admission requests, responses, withdrawal guards, and a bounded `EarlyRelayCache` for temporary block bodies. Early relay publication and compact screening require the published snapshot's best tip; required authentication accepts a parent on any published non-finalized chain; missing parents skip early relay without changing ordinary post-commit relay. Added verifier-only `Request::RejectBlock` and `Response::Rejected` for deterministic failures from ordinary and submitted blocks, with independent body authentication before retaining a rejection. Authenticated rejections suppress early relay and speculative mining until their block heights finalize. Proof-of-work authentication limits rejection growth; a defensive cap stops speculative publication instead of evicting unfinalized entries, without preventing ordinary validation. Transient failures withdraw bodies without recording rejections. Checkpoint completion notifications follow tip publication. The method `FinalizedState::commit_finalized` takes a `CheckpointVerifiedBlock` and optional previous trees instead of a queued block and committed-notification permit; callers must send completion notifications themselves. Handle the new request and response variants in exhaustive matches; use `Request::AuthenticateEarlyRelay` to authenticate without publication. Cached bodies require current-tip serving authorization and are not fully verified state blocks.
