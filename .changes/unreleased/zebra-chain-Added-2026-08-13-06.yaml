body: "`transaction::sprout_joinsplit_key_proof_and_ciphertexts`, which reads the `ephemeralKey`, zero-knowledge proof, and `encCiphertexts` of a Sprout JoinSplit. `zcash_primitives` does not expose accessors for those fields, and only exposes the proof for the Groth16 (V4) variant, not PHGR13 (V2/V3) ([#10461](https://github.com/ZcashFoundation/zebra/pull/10461), [#11415](https://github.com/ZcashFoundation/zebra/pull/11415))."
