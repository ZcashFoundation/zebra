project: zebra-rpc
kind: breaking
body: 'The template updater now takes a `&MempoolTxSubscriber` to rebuild after verified mempool changes. Pass the subscriber to `RpcImpl::spawn_block_template_updater` ([#11374](https://github.com/ZcashFoundation/zebra/pull/11374)). A live updater owns template construction across cache-wait timeouts. Fallback builds share serialized blocking construction, which retains ownership after request cancellation rather than starting competing coinbase proofs.'
