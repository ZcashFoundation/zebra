body: 'Fail configuration loading with an error on invalid `[network.testnet_parameters]` funding streams and lockbox disbursements, instead of panicking at startup or in subsidy RPCs. A Regtest node whose funding streams have too few addresses, which previously started and panicked only when a subsidy was computed, no longer starts; add the missing addresses or set `extend_funding_stream_addresses_as_required = true` ([#12048](https://github.com/ZcashFoundation/zebra/pull/12048)).'
