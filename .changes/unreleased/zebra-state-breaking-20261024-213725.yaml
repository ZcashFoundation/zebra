project: zebra-state
kind: breaking
body: >-
  Added historical body availability through `ReadRequest::HistoryCapabilities`,
  `ReadResponse::HistoryCapabilities`, and `ZebraDb::history_capabilities()`, derived from stored
  transaction rows without changing the database format. Writable opens reject a missing body
  prefix, whether pruned or lost to corruption; invalid retained suffixes return
  `StateInitError::HistoryRead`. Genesis remains retained, and read-only instances continue to
  follow archive writers across restarts without a new column family.
