body: Explicitly empty funding-stream lists survive configuration round-trips and disable default streams. Testnet and Regtest now reject combining an empty list with either legacy funding field; remove both legacy fields to disable streams, or omit the empty list to retain legacy payouts. Omitted settings retain network defaults. ([#11514](https://github.com/ZcashFoundation/zebra/pull/11514))
