project: zebra-rpc
kind: Changed
body: 'The block template updater builds a coinbase-only template on a block that is still being verified, from the early mining work that the state publishes for that block, and `getblocktemplate` serves that template as soon as the block is the best chain tip. The block template updater only precomputes templates once the read state answers `ReadRequest::MiningCandidateChanges`.'
