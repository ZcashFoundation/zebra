project: zebrad
kind: Added
body: "Halving-preserving NU7 issuance is enabled in ordinary builds: from the configured ZIP 234 deployment height, each block reissues a fraction of the parent NSM reserve, rounded up, in addition to its scheduled subsidy. Public Mainnet and Testnet activation and deployment heights remain unassigned ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
