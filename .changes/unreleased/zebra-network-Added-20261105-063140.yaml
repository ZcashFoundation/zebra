project: zebra-network
kind: Added
body: Added negotiated early block relay, connection metadata, `AuthorizedBlocks` serving authorization, `PeerServices::NODE_COMPACT_BLOCKS`, and `BlockAdvertiser::early_relay_recipients`. `Request::AdvertiseEarlyBlock` carries the supplying peer so it is excluded from fanout. `PeerError::InboundOnlyRequest` rejects outbound uses of inbound-only requests ([#11932](https://github.com/ZcashFoundation/zebra/pull/11932)).
