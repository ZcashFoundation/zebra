project: zebrad
kind: Added
body: "`initial_nsm_value_balance` and `nsm_reissuance_height` are available under `[network.testnet_parameters]` for Regtest and configured Testnets without experimental flags. The configured initial balance, in zatoshis, is seeded at NU7 activation. Omitting the reissuance height uses ZIP 237's scheduled-issuance crossover; set an explicit height for accelerated testing. Existing private chains that started reissuance at NU7 must explicitly retain that height or restart from before activation ([#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
