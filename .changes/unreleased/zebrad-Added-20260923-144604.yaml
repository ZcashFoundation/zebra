project: zebrad
kind: Added
body: Custom Testnet and Regtest configurations can set `network.testnet_parameters.nsm_reissuance_height`. The NSM reserve starts with historical unissued supply and funds additional coinbase subsidy from that height, with parent-specific accounting across reorgs and restarts. Mining templates and `getblocksubsidy` include reissuance; subsidy queries requiring an unknown future parent are rejected. Public activation and reissuance heights remain unset.
