project: zebrad
kind: Changed
body: Mining requests share freshness checks and the existing template updater, waiting at most 5 ms for changed membership to be rebuilt. Unchanged acknowledgments cover only the checked build generation. Steady mempool arrivals use a 10 ms background pause extended by build cost, while bursts remain coalesced. Known membership changes rebuild directly without a separate membership scan. Coinbase-only first work bypasses refresh waits; empty full snapshots still refresh on later admissions. Collateral evictions and cancelling notifications do not trigger redundant rebuilds.
