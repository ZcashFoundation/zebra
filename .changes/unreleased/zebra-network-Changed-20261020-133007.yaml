project: zebra-network
kind: Changed
body: Changed `Config` deserialization to reject entries in the configured network's peer list (`initial_mainnet_peers` on Mainnet, `initial_testnet_peers` otherwise) that are not an IP address or DNS name followed by a valid port. These entries previously deserialized and then panicked or failed during peer resolution. The unused list is not checked.
