project: zebrad
kind: Added
body: 'Added optional ZMQ `hashblock` notifications for mining pools, configured with `notify.zmqpubhashblock`. They need a `zebrad` built with the `zmq` Cargo feature, which release binaries and Docker images don''t include; other builds don''t start when the option is set.'
