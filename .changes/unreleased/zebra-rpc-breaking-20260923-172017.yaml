body: '`getblocktemplate` removes `transactions` and `prevblock` from its advertised `mutable` list in ordinary builds, retaining only `time`. Its required coinbase depends on the selected transactions and parent; miners must request a new template instead of changing those independently. ([#11496](https://github.com/ZcashFoundation/zebra/pull/11496), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))'
