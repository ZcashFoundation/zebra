project: zebrad
kind: Added
body: >-
  Added `sync.pin_parallel_cpu_threads` (default `false`), which pins Rayon verification
  workers to distinct physical CPU cores on Linux, one worker per core available to the
  process. A nonzero `sync.parallel_cpu_threads` caps the worker count, and the core count
  takes precedence over `RAYON_NUM_THREADS`. Workers stay unpinned on other systems or if the
  core topology can't be detected
  ([#12533](https://github.com/ZcashFoundation/zebra/pull/12533)).
