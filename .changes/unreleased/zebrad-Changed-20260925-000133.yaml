body: NU7 enforces ZIP 218 limits of 330 actions per Orchard or Ironwood pool, 300 Sapling inputs plus outputs, and zero Sprout JoinSplits per block. Orchard actions + Ironwood actions + Sapling inputs and outputs + twice the JoinSplit count share a global budget of 330.
