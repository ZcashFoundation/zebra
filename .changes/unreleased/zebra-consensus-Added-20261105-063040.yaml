body: Added authenticated early-relay block verification through `Request::CommitEarlyRelay`, including rejection classification for negotiated downloads. Threshold-only checks and bodies with a trusted wire size up to 4 KiB run inline; proof-of-work verification and larger or unknown-size body checks retain bounded blocking admission ([#11932](https://github.com/ZcashFoundation/zebra/pull/11932)).
