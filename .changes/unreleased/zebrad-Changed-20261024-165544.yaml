project: zebrad
kind: Changed
body: 'Fixed the example Grafana dashboards and Prometheus alert rules that queried series Zebra doesn''t export. The `ZebraHighErrorRate` alert fires on block verification errors from `sync.block.error.count`. The `RPCHighLatency` alert ignores `getblocktemplate` long polls, as do the `p99 Latency by Method` panels on the RPC and overview dashboards, which now show each method separately. The `SlowHandshakes` alert fires when the p95 successful handshake takes over 2 seconds, below the 3 second handshake timeout. The RPC tracing dashboard queries the span metrics that the supplied Jaeger configuration exports, and its error panels show zero for methods with requests but no errors. Zebra exports the signature and proof failure counters, which count the items of batches that failed verification, at zero from startup, so the first failures show in `rate()` ([#12041](https://github.com/ZcashFoundation/zebra/pull/12041), [#12438](https://github.com/ZcashFoundation/zebra/pull/12438)).'
