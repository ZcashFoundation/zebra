project: zebrad
kind: Fixed
body: Fixed `ZEBRA_NETWORK__INITIAL_MAINNET_PEERS` and `ZEBRA_NETWORK__INITIAL_TESTNET_PEERS` failing to load with a type error. They now take a comma-separated list of peers, so container deployments no longer need a config file to pin peers ([#10658](https://github.com/ZcashFoundation/zebra/issues/10658)).
