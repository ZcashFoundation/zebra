project: zebra-rpc
kind: Changed
body: Block templates honor network-specific median-time rules and the local two-hour future limit. Cached and on-demand work reject timestamp ranges invalidated by clock rollback. Long polls notify with `submitold = false` when their timestamp range expires during the request; re-polling the same already-expired work waits for a change instead of repeatedly returning it. Cached Testnet difficulty expires according to the candidate-height median-time rule. ([#11529](https://github.com/ZcashFoundation/zebra/pull/11529))
