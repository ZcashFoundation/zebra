project: zebra-rpc
kind: Changed
body: >-
  Body-dependent block RPC methods backed by primary state report incomplete stored blocks as
  errors, distinct from unknown blocks. `getblockheader` reports state failures as internal errors
  rather than missing blocks. Standalone secondary sync retains finalized-tip updates until the
  complete tip body is visible. ([#12155](https://github.com/ZcashFoundation/zebra/pull/12155))
