project: zebra-rpc
kind: Changed
body: >-
  Bounded concurrent block-template proposal and `submitblock` verification work with the
  configured proposal-cache byte capacity. Capacity is admitted before block deserialization and
  retained until verification finishes. A proposal that doesn't fit returns a memory-pressure error
  instead of allocating another decoded block; `submitblock` waits up to 30 seconds for in-flight
  proposals to finish before returning that error.
time: 2026-11-06T11:34:09Z
