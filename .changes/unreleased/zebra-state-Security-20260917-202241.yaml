project: zebra-state
kind: Security
body: 'A peer that serves a block whose authorizing data does not match its header commitment is now scored at the ban threshold. From NU5 onward the block hash and merkle root commit to transaction effects but not to authorizing data (ZIP-244), so a peer could reuse a canonical header with a forged body and keep the block hash unchanged. Such a body is only rejected by the contextual `hashBlockCommitments` check, whose suggested misbehaviour score was hard-coded to 0, so the peer was never scored and could repeat the forgery for free. `InvalidChainHistoryBlockTxAuthCommitment` now scores 100; every other contextual error keeps a score of 0, because it does not prove the serving peer misbehaved. Blocks queued behind a forged body are rejected with a distinct `AncestorRejected` error that scores 0, so the honest peers that served them are not banned along with the forger.'
