project: zebrad
kind: Changed
body: >-
  State copying checks source history and the target chain, body availability, and format before
  opening a writable target. Unavailable ranges, pruned targets, different-chain targets, and
  incompatible older-major targets are rejected without creating or changing the target.
  A target exactly one block behind now receives the remaining block rather than skipping it.
  Target pruning is disabled during replay and comparison.
