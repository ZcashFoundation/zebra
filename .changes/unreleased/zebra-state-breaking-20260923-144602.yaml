body: '`ContextuallyVerifiedBlock::with_block_and_spent_utxos` requires parent value pools. `GetBlockTemplateChainInfo` adds `expected_block_subsidy`, and `ValidateContextError` adds `Subsidy` with a conversion from `subsidy::SubsidyError`, so callers must account for contextual NSM issuance. `CommitBlockError::misbehavior_score` returns 100 for these errors, including nested value-pool errors; unrelated scores are unchanged.'
