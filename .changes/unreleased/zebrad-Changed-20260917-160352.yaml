body: 'The mempool now accepts transactions that pay at least 1000 zatoshis per ZIP-317 logical action instead of 5000 (2000 instead of 10000 for a minimal transaction), block template weights follow the new conventional fee, and `getstandardfee` reports 1000, per [zcash/zips#1352](https://github.com/zcash/zips/pull/1352) ([#11290](https://github.com/ZcashFoundation/zebra/pull/11290)).'
