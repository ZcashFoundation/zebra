project: zebra-state
kind: Security
body: "`Request::KnownBlock` no longer reports blocks that the finalized write task rejected, or dropped behind a rejected block, as sent. The finalized reset now carries the durable tip height, and the state forgets every sent hash above it, so those blocks can be downloaded and committed again without a restart ([GHSA-9hq5-pfgc-cx5h](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-9hq5-pfgc-cx5h))."
