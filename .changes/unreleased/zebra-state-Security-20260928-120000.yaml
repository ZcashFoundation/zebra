project: zebra-state
kind: Security
body: "`Request::KnownBlock` no longer reports blocks that the finalized write task rejected, or dropped behind a rejected block, as sent. After a finalized reset the state forgets its sent hashes, and fails the blocks queued above the reset tip and the blocks of the failed range that arrive later instead of queueing them, so all of them can be downloaded and committed again without a restart ([GHSA-9hq5-pfgc-cx5h](https://github.com/ZcashFoundation/zebra/security/advisories/GHSA-9hq5-pfgc-cx5h))."
