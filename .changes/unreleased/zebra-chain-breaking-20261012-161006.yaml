project: zebra-chain
kind: breaking
body: >-
  `Transaction::value_balance`, `Block::chain_value_pool_change`,
  `Block::chain_value_pool_change_and_fees`, `Block::transaction_fees` and
  `transparent::Input::value` take any `HashMap<OutPoint, U>` with `U:
  AsRef<transparent::Utxo>`, so ordered UTXO maps no longer need to be copied;
  `transparent::Input::value_from_ordered_utxos` is removed in favour of `Input::value`.
  Callers passing an empty map may need a type annotation.
time: 2026-10-12T16:10:06.000000000+02:00
