project: zebra-network
kind: breaking
body: '`init` and `init_with_block_gossip_peer_ips` return a fourth result, `BlockAdvertiser`, which callers must use for outbound block advertisements instead of the ordinary network service. Its bounded fanout reaches eligible busy peers independently of ordinary request readiness and succeeds only after every selected local transport write completes; full queues, revoked connections, and write failures return errors ([#11708](https://github.com/ZcashFoundation/zebra/pull/11708)).'
