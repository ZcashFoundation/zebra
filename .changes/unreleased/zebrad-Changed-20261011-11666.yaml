project: zebrad
kind: Changed
body: 'RPC batches using a single version now accept versionless and JSON-RPC 1.0 calls and return responses in the same format, allowing mining pools such as s-nomp to run their startup checks. Converted requests and responses respect the existing body size limits, so a legacy response that only exceeds the response limit after conversion now returns a legacy-formatted oversized-response error instead of the full result, retaining the upstream error-envelope exception.'
time: 2026-10-11T00:00:00Z
