body: 'The template updater serves the first transaction-bearing build for a tip immediately and stages later builds for the same tip until background proposal validation accepts them. Fallback templates built without a live updater are validated in the background, within the same limit on concurrent proposal checks. `validate_block_proposal` takes an admission semaphore, and proposal checks time out after 30 seconds.'
