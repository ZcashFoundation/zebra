project: zebra-chain
kind: Added
body: Added `state_snapshot::StateSnapshotCommitment`, `Network::state_snapshot_commitment` and `Network::state_snapshot_parameters_hash` for state-snapshot sync, with the pinned Mainnet snapshot's `state_snapshot::{MAINNET_STATE_SNAPSHOT_HEIGHT, MAINNET_STATE_SNAPSHOT_BLOCK_HASH, MAINNET_STATE_SNAPSHOT_MANIFEST}` (a checkpoint, with the manifest still unset, so no commitment is pinned yet), and `NonEmptyHistoryTree::last_peak`, `HistoryPeak`, `HistoryTreeError::InvalidPeak` and `zcash_history::Tree::root_node_data` to read the note commitment tree roots a history tree commits to.
