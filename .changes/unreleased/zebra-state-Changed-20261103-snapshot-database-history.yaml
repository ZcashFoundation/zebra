project: zebra-state
kind: Changed
body: Made a database imported from a state snapshot usable as a pruned node's state. Opening it for writing without `prune_blocks_older_than` fails with `StateInitError::SnapshotDatabase`; the legacy-chain check and the pruning restart witness accept the snapshot block, the first stored body, as the start of history, and the recent block-info format check the snapshot window; `SnapshotBase::body_start` returns that first body's height; reads of blocks and indexed transactions below it return `BlockReadError::BlockBodyUnavailable`; the first commit above the snapshot height runs the checks the import deferred and records them in the marker; and the pruning worker stops instead of spinning when a batch does not advance the retained-body floor.
time: 2026-11-03T12:55:00.000000000Z
