project: zebra-state
kind: Changed
body: Made a database imported from a state snapshot usable as a pruned node's state. Opening it for writing without `prune_blocks_older_than` fails with `StateInitError::SnapshotDatabase`; the legacy-chain check and the pruning restart witness accept the snapshot block, the first stored body, as the start of history, and the recent block-info format check the snapshot window; `SnapshotBase::body_start` returns that first body's height; reads of blocks and indexed transactions below it return `BlockReadError::BlockBodyUnavailable`; the first commit above the snapshot height runs the checks the import deferred and records them in the marker; the pruning worker stops instead of spinning when a batch does not advance the retained-body floor; and the header chain rows below the window are kept and read as the headers of those blocks: `ZebraDb::known_header` and `ZebraDb::header_below_snapshot_window` return them, `HistoryCapabilities::lowest_header_height` reports them, and block locators below the window find them.
time: 2026-11-03T12:55:00.000000000Z
