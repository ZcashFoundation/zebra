project: zebra-state
kind: Changed
body: Made a database imported from a state snapshot usable as a pruned node's state. Opening it for writing without `prune_blocks_older_than` fails with `StateInitError::SnapshotDatabase`; the legacy-chain check, the pruning restart witness and the recent block-info format check accept the snapshot window as the start of history; reads of blocks and indexed transactions below the window return `BlockReadError::BlockBodyUnavailable`; the first commit above the snapshot height runs the checks the import deferred and records them in the marker; and the pruning worker stops instead of spinning when a batch does not advance the retained-body floor.
time: 2026-11-03T12:55:00.000000000Z
