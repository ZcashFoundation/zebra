body: Checkpoint submissions retain bounded work while preserving ordinary prefetch and accepted commits after caller cancellation. Failed ranges release capacity needed for recovery, and surviving ranges advance verification so later checkpoints can continue. Ordinary duplicates preserve healthy mined observers without depending on notification capacity. Synchronization retries local admission pressure and failed-range suffixes with the downloaded body within the original verification deadline.
