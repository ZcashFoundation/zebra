body: Add `ReadRequest::RawBlock` and `ReadRequest::AnyChainRawTransaction`, answered by the new `ReadResponse::RawBlock` and `ReadResponse::RawTransaction` variants, plus `ZebraDb::serialized_block`, `ZebraDb::serialized_transaction` and `RawBytes::into_raw_bytes`. Finalized blocks and transactions are served from their stored bytes without deserializing them. Code that matches on every `ReadRequest` or `ReadResponse` variant must handle the new ones.
