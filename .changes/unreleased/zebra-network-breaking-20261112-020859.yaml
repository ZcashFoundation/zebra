body: Added the `gettreeroots` and `treeroots` messages, `Request::TreeRoots`, `Response::TreeRoots`, and `PeerServices::NODE_TREE_ROOTS` (bit 3), which Zebra now advertises. The peer set routes `Request::TreeRoots` only to ready peers that advertise it. Handle the new variants in exhaustive matches; custom inbound services must answer `Request::TreeRoots` with `Response::TreeRoots`.
