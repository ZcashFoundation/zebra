project: zebrad
kind: Changed
body: >-
  Checkpoint sync commits blocks faster: authorizing data roots are computed before the
  database writer, and large blocks are serialized and read in parallel. RocksDB starts
  flushing column families backed by the oldest live WAL files when total WAL usage
  exceeds 4 GiB.
