project: zebrad
kind: Added
body: >-
  Added field queries to `getblock`: an array of field names as the second argument returns only
  those fields plus `hash`. The names include the new `authdataroot` field, which no verbosity level
  returns, and `hex`, the serialized block that verbosity 0 returns, as an object key. `getblock`
  also accepts `true` and `false` as verbosity 1 and 0, like zcashd. The array form is a Zebra
  extension that zcashd rejects.
  ([#8390](https://github.com/ZcashFoundation/zebra/issues/8390))
