project: zebra-chain
kind: Added
body: >-
  `sapling::tree::NoteCommitmentTree::append_batch` and
  `orchard::tree::NoteCommitmentTree::append_batch` append a block of note commitments at
  once. The Sapling tree hashes independent subtrees in parallel, and the Orchard tree, which
  Ironwood also uses, batches independent parent hashes by tree level.
