body: Non-finalized commits acknowledge published state before finalizing older blocks past the reorg limit. Success does not guarantee durability or completion of those finalization writes; the writer finishes them before processing another block, and finalization failures remain fatal ([#12009](https://github.com/ZcashFoundation/zebra/issues/12009)).
