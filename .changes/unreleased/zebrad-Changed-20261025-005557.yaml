project: zebrad
kind: Changed
body: >-
  Report unavailable historical bodies explicitly in JSON-RPC and gRPC, preserve retained-index
  queries, and expose actual pruning availability through `getblockchaininfo`.
  Keep historical tree-state headers on the requested fork when cached state is stale.
  Block-range and address-transaction streams deliver buffered results before terminal errors;
  stalled consumers receive `DEADLINE_EXCEEDED` rather than a successful end-of-stream.
