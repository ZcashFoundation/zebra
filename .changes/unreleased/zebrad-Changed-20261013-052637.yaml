body: 'Download newly advertised blocks promptly when a block-discovery request is pending, even if inbound gossip drops the advertisement. Gossip skips blocks the syncer is already downloading, but can retry a rejected block while its peer-attribution lookup is pending ([#11710](https://github.com/ZcashFoundation/zebra/pull/11710)).'
