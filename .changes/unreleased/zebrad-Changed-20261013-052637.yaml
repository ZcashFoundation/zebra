project: zebrad
kind: Changed
body: 'Download newly advertised blocks promptly when a block-discovery request is pending, even if inbound gossip drops the advertisement, and tolerate blocks committed by gossip during discovery without restarting sync. Gossip skips blocks the syncer is already downloading, but can retry a rejected block while its peer-attribution lookup is pending ([#11709](https://github.com/ZcashFoundation/zebra/issues/11709)).'
