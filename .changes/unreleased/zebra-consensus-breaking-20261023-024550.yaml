body: Added `Request::CommitEarlyRelay` and early-relay verification error variants. Negotiated downloads authenticate block commitments before exempting later validation failures from peer punishment and suppress repeated expensive verification of deterministic rejections; unavailable parent context permits verification to continue, with bounded authentication before scoring later failures. Ordinary and mined block verification also records authenticated deterministic rejections, preventing renewed speculative mining on rejected blocks. Unauthenticated bodies and transient failures do not populate rejection tracking. Handle the new variants in exhaustive matches.
