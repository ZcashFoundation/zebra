project: zebra-rpc
kind: Changed
body: 'Mining templates, coinbase caching, and `getblocksubsidy` use parent-specific total subsidy. Future coinbases are not precomputed when their NSM reserve is unknown, and subsidy queries requiring an unavailable parent return an error. During NSM reissuance, proposals must match the current parent and its required payouts before transaction verification.'
