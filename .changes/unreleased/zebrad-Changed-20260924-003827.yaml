project: zebrad
kind: Changed
body: 'Block downloads prefer eligible upstream peers that serve historic blocks and delay local refusals while those peers are busy. Banned or outdated connections do not suppress fallback to other sources. Stuck peer connections that remain unready past the request timeout are dropped when the peer set is next polled, freeing their slots for other connections ([#11515](https://github.com/ZcashFoundation/zebra/pull/11515), [#11748](https://github.com/ZcashFoundation/zebra/issues/11748)).'
