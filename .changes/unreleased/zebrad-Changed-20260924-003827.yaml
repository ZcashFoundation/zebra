project: zebrad
kind: Changed
body: 'Block downloads now prefer peers that serve historic blocks, and wait for a busy one to become ready instead of refusing immediately, so retries do not exhaust near the chain tip. Stuck peer connections that remain unready past the request timeout are dropped when the peer set is next polled, freeing their slots for other connections ([#11515](https://github.com/ZcashFoundation/zebra/pull/11515), [#11748](https://github.com/ZcashFoundation/zebra/issues/11748), [#11521](https://github.com/ZcashFoundation/zebra/pull/11521)).'
