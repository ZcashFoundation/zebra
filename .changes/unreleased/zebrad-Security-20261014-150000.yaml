project: zebrad
kind: Security
body: "Update `rustls` to 0.23.46 to fix RUSTSEC-2026-0346, RUSTSEC-2026-0347, RUSTSEC-2026-0348 and RUSTSEC-2026-0349. Zebra's legacy peer connections and RPC connections do not use TLS. The experimental, opt-in version 2 peer-to-peer protocol does, and ships with the fixed version. Outbound HTTPS clients such as `sentry`, OpenTelemetry and Elasticsearch are also affected."
time: 2026-10-14T15:00:00.000000000-03:00
