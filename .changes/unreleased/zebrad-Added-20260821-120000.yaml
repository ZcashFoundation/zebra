body: 'New [zcashd API Migration Guide](https://zebra.zfnd.org/user/zcashd-api-migration-guide.html) book page, recording which component owns each of the 135 RPC methods `zcashd` 6.20.0 registers, plus its ZMQ topics, REST interface, and notification hooks: whether Zebra or Zallet provides it, what replaces it, or why it was retired, with notes on how Zebra''s responses differ from `zcashd`''s ([#11021](https://github.com/ZcashFoundation/zebra/issues/11021)). New [Running Zallet with Zebra](https://zebra.zfnd.org/user/zallet.html) page describing the `zebrad` build and configuration Zallet needs.'
