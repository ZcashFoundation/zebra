body: Block templates honor network-specific median-time rules and the local two-hour future limit, including cached and on-demand work after clock rollback. Expired long polls end without waiting for new transactions or a new tip, and cached Testnet difficulty respects the candidate-height rules. Empty timestamp ranges return an error. ([#11529](https://github.com/ZcashFoundation/zebra/pull/11529))
