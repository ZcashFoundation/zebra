project: zebra-state
kind: breaking
body: >-
  Changed `ZebraDb::transaction` to return `Result`. Callers of
  `Request::{Transaction, AnyChainTransaction}` and
  `ReadRequest::{Transaction, AnyChainTransaction}` must handle `BlockReadError` for unavailable
  historical bodies, distinct from unknown transactions. Spent-output queries also propagate
  unavailable parent bodies.
  Changed both `BlockHeader` response variants to carry `Option<BlockHeader>`, separating unknown
  blocks from failed reads while preserving the header, hash, height, and next-block hash fields.
  Header responses keep the requested hash and successor on the same fork when cached and
  finalized chains diverge.
