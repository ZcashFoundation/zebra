kind: Changed
body: 'When available, the `getblocktemplate` RPC answers from the template precomputed by
  `methods::RpcImpl::spawn_block_template_updater()`. A cached call validates the chain tip against
  the state instead of reading the mempool, selecting transactions, and building a coinbase
  transaction; without usable cached work, it builds a template on demand. Long polling waits for
  a different long poll ID, a chain tip change, or for `max_time` to pass. Tip freshness is checked
  again after waiting, and cached Testnet work is refreshed when minimum-difficulty rules make
  easier work available. Background coinbase proofs remain bounded across tip changes. A
  precomputed template''s transactions can be a few seconds behind the mempool
  ([#11370](https://github.com/ZcashFoundation/zebra/issues/11370)).'
