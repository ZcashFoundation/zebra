project: zebrad
kind: Added
body: 'Added metrics to Sentry: when `SENTRY_DSN` is set, Zebra sends every metric that the Prometheus endpoint exports, once a minute. Counters send their increase, gauges their latest value, and histograms up to 20 values per set of labels as distributions. Metrics carry the network upgrade at the tip, whether the node is near the tip (`chain.near_tip`), and the process uptime.'
