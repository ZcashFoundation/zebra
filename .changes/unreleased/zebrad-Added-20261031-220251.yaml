project: zebrad
kind: Added
body: 'Added metrics to Sentry: when `SENTRY_DSN` is set, Zebra sends every metric that the Prometheus endpoint exports, once a minute. Counters send their increase, gauges their latest value when it changes and at least every 5 minutes, and histograms up to 20 values per set of labels as distributions. Each minute sends at most 1,500 metrics and at most 256 sets of labels per metric, and sends none while the Sentry SDK is still sending earlier data, so metrics never fill the queue they share with events, logs, and sessions. The new `zebrad.sentry.metrics.dropped.total` counter counts the values left out. Metrics carry the network upgrade at the tip, whether the node is near the tip (`chain.near_tip`), and the process uptime.'
