project: zebrad
kind: Security
body: 'The syncer no longer restarts its sync round when a peer serves a block body whose authorizing data does not match the header commitment. The failure was an ordinary `Invalid` verification error, so it cancelled the round and idled the syncer for `SYNC_RESTART_DELAY`, and the block hash was dropped instead of being re-requested. The hash is canonical and only the served body was forged, so the syncer now continues the round and re-requests the body from another peer, bounded by `MAX_BLOCK_REOBTAIN_RETRIES`. Blocks the state rejects because they were queued behind a forged body are re-requested the same way, without scoring the peers that served them.'
