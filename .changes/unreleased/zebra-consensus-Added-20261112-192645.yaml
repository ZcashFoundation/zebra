body: Added `metrics::describe()`, which describes every metric the crate records, with its unit and a one-line description, `metrics::LABELS`, which lists the label keys of each labelled metric, and `metrics::register_failure_counters()`, which registers the signature and proof failure counters in `metrics::FAILURE_COUNTERS` at zero.
