project: zebrad
kind: Security
body: Bound queued blocks and checkpoint commit owners, including work retained after callers cancel requests or state commits fail. The syncer requests a block dropped from a full queue again without cancelling other downloads, restarting the round if bounded re-downloads exhaust their retries. The `sync.block.error.count` metric counts these errors with the `queue_full` kind.
