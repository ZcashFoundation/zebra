project: zebra-node-services
kind: Added
body: Added `compact::ReconstructedBlock`, a block with its serialized size and transaction hashes. Its constructor rejects blocks without transactions, sizes above the block limit, duplicate transactions, and transactions that do not match the header's Merkle root, and trusts that the size is exact ([#11998](https://github.com/ZcashFoundation/zebra/pull/11998)).
