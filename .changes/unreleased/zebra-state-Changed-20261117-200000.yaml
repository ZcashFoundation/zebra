project: zebra-state
kind: Changed
body: 'Database format 29.2.0 compacts the address UTXO index once and keeps it compacted as outputs are spent, so address queries no longer step over the deletion markers of spent outputs. The upgrade does not rewrite any records, so read-only opens of older 29.x and 28.x databases still work.'
