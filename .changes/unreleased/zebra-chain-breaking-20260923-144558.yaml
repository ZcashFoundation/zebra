project: zebra-chain
kind: breaking
body: 'ZIP 237, referenced by [ZIP 259](https://zips.z.cash/zip-0259), adds an NSM reserve seeded at NU7 activation minus one from historical unissued supply, accruing 60% of block fees and reissuing from a configured height. `ValueBalance::total` includes the reserve for monetary-cap accounting; RPC Issued Supply excludes it. `subsidy::block_subsidy` requires the parent reserve and returns total subsidy; `Block::chain_value_pool_change` requires the network and parent value pools. Adds `subsidy::{nsm_fee_contribution, miner_fees, nsm_subsidy, scheduled_block_subsidy, funding_stream_address, miner_fees_are_valid, subsidy_is_valid}`, `ValueBalance::{with_nsm_reserve_seed, nsm_reserve_amount, set_nsm_reserve_amount}`, `RegtestParameters::nsm_reissuance_height`, `Parameters::nsm_reissuance_height`, `Network::nsm_reissuance_height`, and `ParametersBuilder::with_nsm_reissuance_height`. Reissuance requires a valid nonzero height at or after NU7 and a positive integer coefficient; NU7 schedule validation includes genesis issuance used by the historical seed. `ValueBalance::to_bytes` returns `[u8; 56]` including the reserve. Use `scheduled_block_subsidy` for scheduled issuance alone; exhaustive matches must handle `SubsidyError::Other` and `ValueBalanceError::{NsmReserve, Subsidy}`. ([#11530](https://github.com/ZcashFoundation/zebra/pull/11530))'
