project: zebrad
kind: Changed
body: 'Added `network.compact_block_relay`, on by default; mining nodes should keep it enabled. Between peers with it enabled, blocks extending the best tip are relayed before transaction verification finishes, and as compact blocks rebuilt from the mempool, with full-block fallback. Other peers keep ordinary relay. Negotiation uses service bit 16 from the draft [Compact Block Relay ZIP](https://github.com/zcash/zips/pull/1429); see "Early block relay and compact blocks" in the mining guide.'
