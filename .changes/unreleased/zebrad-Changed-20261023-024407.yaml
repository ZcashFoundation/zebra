project: zebrad
kind: breaking
body: 'Enabled `network.compact_block_relay` by default: compatible peers can relay authenticated next-tip blocks before transaction verification finishes; ordinary peers retain committed-only relay. Set it to `false` to disable it. Replace the previous experimental configuration key with this setting; peers using the previous experimental service bit no longer negotiate early relay. Rejected compact announcements share the receive cooldown, and stale parents are discarded before proof-of-work verification. Missing parent context does not make a later validation failure punitive, and withdrawn early responses fall back to committed serving before their local wire write begins.'
