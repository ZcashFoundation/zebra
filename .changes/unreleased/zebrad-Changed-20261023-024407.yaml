project: zebrad
kind: Added
body: Compact block and authenticated early relay are enabled by default with compatible peers using the draft Compact Block Relay ZIP service bit. Set `network.compact_block_relay = false` to disable them; ordinary peers retain committed-only relay. Authenticated rejected blocks remain ineligible for early relay and speculative mining until finalization ([#11932](https://github.com/ZcashFoundation/zebra/pull/11932)).
