body: 'Added default-off `network.experimental_early_block_relay` for coordinated private-network experiments: compatible peers can relay authenticated next-tip blocks before transaction verification finishes; legacy peers retain committed-only relay. Missing parent context does not make a later validation failure punitive, and withdrawn early responses fall back to committed serving before their local wire write begins.'
