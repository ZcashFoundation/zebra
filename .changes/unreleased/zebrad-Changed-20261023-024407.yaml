project: zebrad
kind: Added
body: 'Added compact block relay, enabled by default with peers that also enable it, using service bit 16 (`NODE_COMPACT_BLOCKS`) from the [draft Compact Block Relay ZIP](https://github.com/zcash/zips/pull/1429). After NU5, a block extending the best tip can be relayed to those peers once its proof of work and transaction commitments have been checked, before full validation. Receivers rebuild compact blocks from their mempool, request missing transactions once, fall back to the full block, and still validate every block fully. Other peers keep ordinary relay after commit. Set `network.compact_block_relay = false` to disable it ([#11932](https://github.com/ZcashFoundation/zebra/pull/11932)).'
