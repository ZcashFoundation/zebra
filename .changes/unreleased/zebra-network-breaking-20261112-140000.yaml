project: zebra-network
kind: breaking
body: 'Added compact block relay, off by default: the `Config::compact_block_relay` field, the `ConnectionInfo::early_block_relay` field, the `PeerServices::NODE_COMPACT_BLOCKS` service bit, the `Request::AdvertiseCompactBlock`, `Request::CheckCompactHeader`, `Request::CompactBlockTransactions` and `Request::CheckCompactBlock` inbound requests, the `Response::CompactBlockTransactions` and `Response::EarlyBlocks` responses, and `PeerError::InboundOnlyRequest`. Block downloads from connections that negotiated compact block relay return `Response::EarlyBlocks` instead of `Response::Blocks`. A block rebuilt from a compact announcement answers an ordinary block download, so it is verified like any other block. Code that builds a `Config` or `ConnectionInfo` with a struct literal must set the new fields, and exhaustive matches must handle the new variants.'
