project: zebra-rpc
kind: breaking
body: >-
  `RpcMetricsMiddleware::new` and `RpcTracingMiddleware::new` now require an
  `Arc<HashSet<&'static str>>` of registered RPC method names, collected from
  `RpcModule::method_names()`. Unregistered names use the `unknown` method label in request,
  duration and error metrics, and the `unknown` value in the `rpc.method` span field
  ([#11837](https://github.com/ZcashFoundation/zebra/pull/11837)).
