body: "`initial_nsm_value_balance` and `zip234_deployment_height` under `[network.testnet_parameters]` are available for Regtest and configured Testnets in ordinary builds. Serialization preserves an omitted deployment height, whose effective value falls back to NU7 activation ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
