project: zebrad
kind: Changed
body: >-
  Mining templates rebuild immediately after isolated verified mempool changes,
  waking long polls on publication. Rebuilds pause for at least one second or the previous
  build's duration, whichever is longer; the five-second backstop respects that pause,
  while chain-tip changes rebuild immediately. Cached build failures no longer
  interrupt mining after the chain tip changes
  ([#11374](https://github.com/ZcashFoundation/zebra/pull/11374)).
time: 2026-10-11T00:00:00Z
