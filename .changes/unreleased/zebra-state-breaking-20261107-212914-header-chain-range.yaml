body: Added `ReadRequest::HeaderChainRange` and `ReadResponse::HeaderChainRange`, which read header chain headers by height, including those above the finalized tip, and `state_snapshot::import::carry_header_chain`, which copies the synced headers of a closed header-only state, from genesis, into a staged state snapshot database, so the node keeps every header.
