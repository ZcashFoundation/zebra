project: zebrad
kind: Changed
body: Mining templates are served as soon as they are built and checked as block proposals in the background. Solved templates reuse successful checks; rejected work, including narrowed timestamps and RPC fallback builds, restores valid work for that parent or is withdrawn when no valid fallback exists. RPC block proposal checks are limited to two at a time and 30 seconds each.
