project: zebrad
kind: Changed
body: Mining templates are served as soon as they are built and checked as block proposals in the background. Solved templates reuse successful checks; rejected work, including narrowed timestamps and RPC fallback builds, restores valid work for that parent or is withdrawn when no valid fallback exists. Rejection also revokes old-work authorization in `submitold`; ordinary fee-only refreshes still permit old work. Restoring valid work preserves normal mempool-change and periodic refresh pacing. RPC proposals must extend the current tip at the next height on every network. Their 30-second response deadline includes readiness, and the two-request limit continues to count verification after timeout or client cancellation.
