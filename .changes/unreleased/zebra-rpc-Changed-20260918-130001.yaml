body: "From NU7 activation, `getblocktemplate` coinbases claim only the miner share after withholding 60% of aggregate fees, rounded down. The coinbase `fee` metadata remains the negative gross fee total, not the net payout, including when different gross totals round to the same miner share ([#11487](https://github.com/ZcashFoundation/zebra/pull/11487), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
