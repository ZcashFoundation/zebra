project: zebra-state
kind: breaking
body: 'Remove the dedicated block, transaction, UTXO, address, and note-commitment-subtree read variants from `ReadRequest` and `ReadResponse`; they are replaced by the generic queries. Migration: `Block`, `AnyChainBlock`, `BlockAndSize`, `BlockHeader`, `TransactionIdsForBlock`, `AnyChainTransactionIdsForBlock`, `BlockInfo`, `SaplingTree`, `OrchardTree`, `IronwoodTree`, `BestChainBlockHash`, and `Depth` become `BlockQuery` with the matching `BlockField` set and `ChainSelector` (block size comes from `BlockInfo`, depth is confirmations minus one, and the any-chain flag is `QueriedBlock::in_best_chain`); `Transaction` and `AnyChainTransaction` become `TransactionQuery`; `UnspentBestChainUtxo` and `AnyChainUtxo` become `UtxoQuery`; `AddressBalance`, `TransactionIdsByAddresses`, and `UtxosByAddresses` become `AddressQuery`; `SaplingSubtrees`, `OrchardSubtrees`, and `IronwoodSubtrees` become `NoteCommitmentSubtrees` with a `NoteCommitmentTreeKind` ([#8390](https://github.com/ZcashFoundation/zebra/issues/8390)).'
time: 2026-08-22T05:24:06.000000000Z
