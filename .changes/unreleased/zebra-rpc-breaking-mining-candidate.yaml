kind: breaking
body: 'Mining templates can extend a proof-of-work checked parent before verification completes. Early templates are coinbase-only and withdrawn on rejection or after 30 seconds; cached work is checked against live candidate ownership before serving and long polls recheck it immediately on commitment. New candidates interrupt template retry backoff. Upgrade with the matching `zebra-state` and `zebra-consensus` mining-candidate APIs.'
