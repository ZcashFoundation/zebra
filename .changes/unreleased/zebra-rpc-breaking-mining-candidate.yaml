project: zebra-rpc
kind: breaking
body: 'Mining templates can extend a proof-of-work checked parent before verification completes. Early templates are coinbase-only and withdrawn on rejection or after 30 seconds. Authenticated deterministic rejections from ordinary and submitted blocks suppress further speculative template work until finalization, including detached candidate responses; cached work is checked against live candidate ownership before construction, publication and serving. Long polls recheck it immediately on commitment, and new candidates interrupt template retry backoff. Upgrade with the matching `zebra-state` and `zebra-consensus` mining-candidate APIs.'
time: 2026-10-11T00:00:00Z
