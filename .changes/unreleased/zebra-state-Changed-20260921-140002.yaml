project: zebra-state
kind: Changed
body: 'Database format 28.1.0: the chain value pool `ValueBalance` can widen from 48 to 56 bytes for the NU7 NSM reserve balance, and `BlockInfo` records from 52 to 60 bytes with it. Readers accept historical record widths and derive the reserve from scheduled issuance less issued supply at NU7 activation minus one. Writers retain the v28.0 widths before NU7, reconstructing the historical seed on read rather than persisting it. Existing v28.0 databases upgrade in place without a resync or a new major format version.'
