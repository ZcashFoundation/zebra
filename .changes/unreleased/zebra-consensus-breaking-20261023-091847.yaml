project: zebra-consensus
kind: breaking
body: 'Changed the block verifier from `router::init` to trust the `mempool` service passed to `router::init` for consensus. It asks the service for a block''s transactions with `mempool::Request::VerifiedTransactionsForBlock`, skips the transaction verifier for the ones it reuses, checks only the rules that depend on the block for them, and adds their miner fees and signature operation counts from the response to the block''s totals. A custom mempool service must answer with no transactions, or, when the block''s parent is its last seen tip, only with the `VerifiedUnminedTx`s that the mempool transaction verifier from `router::init` returned, unmodified apart from the `time` and `height` that the mempool sets, with the tip height that each one was verified at as `height`. A later fee change, such as a fee delta for prioritisation, must be kept in a separate field, not in `miner_fee`.'
