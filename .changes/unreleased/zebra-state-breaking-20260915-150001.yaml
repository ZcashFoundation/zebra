project: zebra-state
kind: breaking
body: "Ordinary builds use database format v29.0.0. Its registered upgrade automatically moves compatible v28 state into `state/v29` when no v29 database exists, without a resync or record migration. Legacy 48-byte value-pool and 52-byte block-info records remain readable with a zero NSM balance; new writes use 56 and 60 bytes. New block-info records append NSM after the existing pool-and-size prefix. Direct database readers must use a v29-compatible `zebra-state` dependency and be upgraded with the writer; v28 readers cannot read the wider records. Retain a v28 backup before upgrading for rollback: disabling `state.delete_old_database` does not preserve the directory that the upgrade moves. Manual directory renames are not a substitute for the supported upgrade. The public `zebra_state::IntoDisk::Bytes` associated type changes from `Vec<u8>` to `[u8; 60]` for `zebra_chain::block_info::BlockInfo`, and from `[u8; 48]` to `[u8; 56]` for `zebra_chain::value_balance::ValueBalance<NonNegative>`. The NSM reserve is seeded once at NU7 activation, persisted with each block, and excluded from issued supply. `GetBlockTemplateChainInfo::chain_value_pools` is now unconditional; update struct literals. Contextual invalid-subsidy errors score the sending peer 100, while descendants of invalid blocks score zero ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
