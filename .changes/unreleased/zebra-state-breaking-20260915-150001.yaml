project: zebra-state
kind: breaking
body: "Ordinary builds use database format v29.0.0 and its separate `state/v29` directory, with fixed 56-byte value-pool and 60-byte block-info records. The public `zebra_state::IntoDisk::Bytes` associated type changes from `Vec<u8>` to `[u8; 60]` for `zebra_chain::block_info::BlockInfo`, and from `[u8; 48]` to `[u8; 56]` for `zebra_chain::value_balance::ValueBalance<NonNegative>`. The NSM reserve is seeded once at NU7 activation, persisted with each block, and excluded from issued supply. `GetBlockTemplateChainInfo::chain_value_pools` is now unconditional; update struct literals. Contextual invalid-subsidy errors score the sending peer 100, while descendants of invalid blocks score zero ([#11454](https://github.com/ZcashFoundation/zebra/pull/11454), [#11530](https://github.com/ZcashFoundation/zebra/pull/11530))."
time: 2026-09-15T15:00:01.000000000-06:00
