project: zebrad
kind: Added
body: 'Added opt-in `state.fast_tree_sync`, using authenticated peer-supplied tree roots up to the embedded trees. Fast sync starts only after peers at 3 distinct IP addresses have supplied roots; until then, blocks commit with tree updates. Every node advertises `NODE_TREE_ROOTS` (service bit 3) and answers `gettreeroots` from its finalized chain, even with `state.fast_tree_sync` off. Busy root-serving nodes send an explicit refusal so requesting peers can retry without timing out. Root requests round-robin among ready peers, accepting valid short prefixes without excluding their suppliers. Malformed authorizing-body recovery resets the queue after 120 seconds instead of stopping Zebra. A fast-synced database is a one-way upgrade: older Zebra versions and direct readers cannot use it; retain a pre-fast-sync backup for rollback, or delete the state cache and resync with the option disabled. Missing roots stop Zebra after 120 seconds with recovery instructions, including after restarting with the option disabled. At fast-synced heights, `getblock`, `getblockheader` and lightwalletd compact blocks report the stored tree sizes and roots, `z_gettreestate` returns error -20 "tree state unavailable: fast-synced height", and the lightwalletd `GetTreeState` and `GetLatestTreeState` methods return `UNAVAILABLE`. New legacy messages and service bit 3 remain draft pending a ZIP.'
