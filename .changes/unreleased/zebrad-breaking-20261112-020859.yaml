project: zebrad
kind: breaking
body: 'Added opt-in `state.fast_tree_sync`, using authenticated peer-supplied tree roots up to the embedded trees. Every node advertises `NODE_TREE_ROOTS` (service bit 3) and answers `gettreeroots` from its finalized chain, even with `state.fast_tree_sync` off. Root requests round-robin among ready peers, accepting valid short prefixes without excluding their suppliers. Malformed authorizing-body recovery resets the queue after 120 seconds instead of stopping Zebra. A fast-synced DB 29.1 is a one-way upgrade: older Zebra versions and direct readers cannot use it; retain a pre-fast-sync backup for rollback, or delete the state cache and resync with the option disabled. Missing roots stop Zebra after 120 seconds with recovery instructions, including after restarting with the option disabled. Wallet tree-state requests at fast-synced heights return an explicit unavailable error. New legacy messages and service bit 3 remain draft pending a ZIP.'
time: 2026-11-12T02:08:59.126867893+01:00
